const LESSONS=[{"n":1,"t":"Orientação e diagnóstico","goal":"Entender o que você está construindo, medir de onde parte e ver como é o trabalho de quem administra contratos de obra.","intro":["Alexis, o objetivo desta pós não é acumular horas de vídeo. É sair capaz de fazer quatro coisas com um contrato de obra na mão: ler onde está o risco, registrar o que acontece, provar quanto prazo e quanto dinheiro cada evento custou e levar isso a uma negociação ou a um comitê de disputas.","A tese que organiza tudo: pleito é prova, não argumento. A maioria dos pleitos de obra perde porque a notificação saiu fora do prazo, o diário de obra não registrou o evento e o cronograma não permite medir o atraso, não porque o direito é fraco. Por isso o curso começa no contrato, passa por cronograma e custo e só então chega ao Dispute Board.","O perfil que você está formando é o de administrador contratual e analista de pleitos de obra: gerente de contratos de construtora, consultor de claims, assessor de comitê de disputas e, mais adiante, candidato a membro de comitê.","O diagnóstico abaixo tem nove competências. Cada uma traz uma explicação, um vídeo curto e uma ficha em PDF da técnica. Assista, leia a ficha e só então dê a sua nota: assim a nota mede o que você sabe depois de ver o básico, e o resultado aponta onde reforçar.","Como estudar cada aula: leia a explicação, assista aos vídeos principais na ordem, abra as leituras indicadas e, no fim, escreva o seu resumo do que aprendeu. O resumo é o único texto que você escreve. Ele serve para fixar e vira o seu material de revisão.","Limites. O curso é técnico e de gestão, não parecer jurídico. Prazos, efeitos de decisões e jurisprudência devem ser confirmados com advogado e na fonte oficial antes de uso em um caso real."],"steps":[{"k":"vídeo","t":"Gestão e planejamento de obras (podcast Construecast)","why":"Podcast em português sobre gestão e planejamento de obras: visão geral do trabalho.","h":1,"u":"https://www.youtube.com/watch? usto de atraso e perda de produtividade","why":"Nenhum vídeo com mais de 10 mil visualizações e até 2 anos foi encontrado para este tema. Use a ficha e a apostila.","h":0,"u":null,"pick":"A","src":"Ficha do curso","f":"bdi-tcu","d":"d7"},{"k":"vídeo","t":"Valor Agregado (EVM) explicado em 11 minutos","why":"Competência: Valor agregado (EVM).","h":1,"u":"https://www.youtube.com/watch?v=vyT2YrgHHJo","pick":"P","src":"YouTube · 33,5 mil visualizações · nov/2025 · inglês · 11 min","f":"evm","d":"d8"},{"k":"vídeo","t":"Arbitragem internacional na construção, parte 3","why":"Competência: Dispute Boards e resolução de disputas.","h":1,"u":"https://www.youtube.com/watch?v=ZY-aZmklFQI","pick":"P","src":"YouTube · 33,3 mil visualizações · jul/2025 · inglês · 7 min","f":"dispute-boards","d":"d9"},{"k":"pdf","t":"Apostila técnica da aula 1 (PDF)","why":"Explica a aula e todas as técnicas, com o roteiro e as perguntas.","h":1,"u":"apostilas/aula-1.pdf","pick":"P","src":"Apostila do curso"},{"k":"pdf","t":"Ler as fichas em PDF desta aula","why":"Uma ficha por técnica, listadas no fim desta página.","h":1,"u":null,"pick":"P","src":"Fichas do curso"},{"k":"vídeo","t":"Guia completo de gerenciamento de projetos de construção (Tim Fairley)","why":"Muito longo (quase 9 horas); veja trechos se quiser.","h":0,"u":"https://www.youtube.com/watch?v=wFGouP9ubcg","pick":"A","src":"YouTube · 313 mil visualizações · jul/2025 · inglês · 8h57","f":"adm-contratual"},{"k":"vídeo","t":"Planilha de gestão de contratos no Excel (validade, vencimento, valor)","why":"Planilha de controle de contratos no Excel.","h":0,"u":"https://www.youtube.com/watch?v=O9wZrKEXDXg","pick":"A","src":"YouTube · 16,4 mil visualizações · jan/2025 · português · 23 min","f":"adm-contratual"}],"q":["Qual obra e qual tipo de evento (atraso, aditivo, perda de produtividade) serão seu caso de referência ao longo do curso?","O que você quer ser capaz de fazer em 10 semanas que hoje não faz?"],"sum":"Escreva: (1) o que faz um administrador contratual de obra; (2) por que pleito é prova e não argumento; (3) quais as 3 competências em que você mais precisa evoluir, segundo o diagnóstico, e o que cada uma das nove significa em uma frase.","h":12},{"n":2,"t":"Fundamentos da administração contratual de obras","goal":"Empreitada, tipos de preço, risco e controle de mudanças: a base sem a qual o resto vira técnica sem contrato.","intro":["Na obra privada, o contrato manda e o Código Civil preenche as lacunas. A empreitada está nos arts. 610 a 626. O art. 618 impõe ao empreiteiro responsabilidade pela solidez e segurança da obra por cinco anos, prazo que as partes não reduzem por contrato.","O tipo de preço define quem carrega qual risco. No preço global, o contratado assume o risco de quantidade: se o projeto não mudou e ele errou o quantitativo, paga. No preço unitário, o contratante paga o que foi medido e carrega o risco de variação de quantidade. Na administração, o contratante reembolsa custos mais uma taxa. No EPC ou turn-key, o contratado assume projeto, suprimento e construção, e com isso o risco das interfaces.","A matriz de risco diz, para cada evento, quem paga e quem ganha prazo. Todo pleito nasce na fronteira entre um risco do contratante e um do contratado. Se a matriz é vaga, a disputa é certa.","Gestão de mudanças é o hábito que evita o pleito: toda alteração de escopo, prazo ou preço precisa de ordem formal, assinada por quem tem poder, antes ou logo depois de acontecer."],"steps":[{"k":"vídeo","t":"Contratada: pontos de atenção na matriz de riscos","why":"Pontos de atenção do contratado na matriz de riscos.","h":1,"u":"https://www.youtube.com/watch?v=ItCgDbpxn1I","pick":"P","src":"YouTube · 16,2 mil visualizações · mar/2026 · português · 12 min","f":"matriz-risco"},{"k":"norma","t":"Código Civil, arts. 610 a 626: contrato de empreitada","why":"Fonte primária. Leia os artigos inteiros.","h":3,"u":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","pick":"P","src":"Planalto"},{"k":"livro","t":"Comentários à Lei de Licitações e Contratações Administrativas (Marçal Justen Filho)","why":"Obra de referência sobre a Lei 14.133. Leia a parte de contratos e alterações. Página de livraria; confirme a edição.","h":3,"u":"https://www.martinsfontespaulista.com.br/comentarios-a-lei-de-licitacoes-e-contratacoes-administrativas---2025-1140457/p","pick":"P","src":"Livraria"},{"k":"norma","t":"Lei 14.133/2021: texto integral","why":"Leia as definições do art. 6º e a parte de contratos. Confirme os artigos citados nas fichas.","h":2,"u":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","pick":"P","src":"Planalto"},{"k":"pdf","t":"Apostila técnica da aula 2 (PDF)","why":"Explica a aula e todas as técnicas, com o roteiro e as perguntas.","h":2,"u":"apostilas/aula-2.pdf","pick":"P","src":"Apostila do curso"},{"k":"pdf","t":"Ler as fichas em PDF desta aula","why":"Uma ficha por técnica, listadas no fim desta página.","h":1,"u":null,"pick":"P","src":"Fichas do curso"},{"k":"curso","t":"Complemento FGV: MBA em Gestão, Incorporação e Construção Imobiliária","why":"Grade com contratos e aquisições. Opcional e pago, fora das 100 h.","h":0,"u":"https://educacao-executiva.fgv.br/rj/nova-iguacu/cursos/mba-pos-graduacao/mba-blended-semipresencial/mba-em-gestao-incorporacao-e-construcao-imobiliaria","pick":"A","src":"FGV"}],"q":["Qual a diferença de risco de quantitativo entre empreitada por preço global e por preço unitário?","Qual o prazo e o artigo do Código Civil sobre solidez e segurança da obra?","O que a matriz de risco do seu contrato aloca ao contratado e ao contratante?"],"sum":"Escreva: (1) as diferenças entre preço global, unitário, administração e EPC quanto a risco; (2) o que é uma matriz de risco e por que ela evita pleitos; (3) por que ordem formal de mudança importa.","h":12},{"n":3,"t":"Contratos públicos de obras: Lei 14.133 e TCU","goal":"Alteração contratual, reequilíbrio, reajuste e repactuação em obra pública.","intro":["Em obra pública, o contrato é administrativo: a Administração pode alterar unilateralmente dentro de limites, e o contratado tem direito à manutenção do equilíbrio econômico-financeiro. A Lei 14.133/2021 trata das alterações nos arts. 124 a 136. O art. 125 fixa os limites de acréscimos e supressões (25%, e 50% para reforma de edifício ou equipamento).","Três ferramentas, três usos. Reajuste aplica o índice previsto no contrato, em geral a cada 12 meses. Repactuação é própria de serviços contínuos com mão de obra. Reequilíbrio recompõe o equilíbrio inicial quando um fato extraordinário ou uma alteração o rompe; o art. 124, II, d, é a base citada para força maior, caso fortuito e fato do príncipe. Segundo orientação do TCU, o pedido deve ser feito durante a vigência do contrato e antes de eventual prorrogação.","O erro típico do contratado em obra pública é tratar o pedido de reequilíbrio como carta comercial. Ele precisa de fato, nexo, planilha e documentos de suporte. A ficha de reequilíbrio lista os documentos que acompanham o pedido."],"steps":[{"k":"norma","t":"Lei 14.133/2021: alterações (arts. 124 a 136) e extinção (a partir do art. 137)","why":"Fonte primária. Leia o capítulo de alterações inteiro.","h":3,"u":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","pick":"P","src":"Planalto"},{"k":"vídeo","t":"Acréscimo acima de 25% em contratos públicos: é possível?","why":"Responde se é possível ultrapassar 25% de acréscimo.","h":1,"u":"https://www.youtube.com/watch?v=wCB2g24Tm0c","pick":"P","src":"YouTube · 15,2 mil visualizações · set/2025 · português · 11 min","f":"aditivos-14133"},{"k":"vídeo","t":"O TCU pode autorizar acréscimos acima de 25%? Entenda o Acórdão 1753","why":"Trata do Acórdão 1753 do TCU sobre acréscimos acima de 25%.","h":1,"u":"https://www.youtube.com/watch?v=MeNQtzzmzY4","pick":"P","src":"YouTube · 29,3 mil visualizações · jul/2026 · português · 14 min","f":"aditivos-14133"},{"k":"vídeo","t":"Nova Lei de Licitações e Contratos Administrativos: resumo da Lei 14.133","why":"Resumo geral da Lei 14.133.","h":1,"u":"https://www.youtube.com/watch?v=TGKWT0Cdm-M","pick":"P","src":"YouTube · 46,6 mil visualizações · fev/2026 · português · 14 min","f":"aditivos-14133"},{"k":"vídeo","t":"Meu contrato não tem reajuste! O que a lei diz?","why":"O que a lei diz quando o contrato não prevê reajuste.","h":1,"u":"https://www.youtube.com/watch?v=9xDS9n5UHEk","pick":"P","src":"YouTube · 20 mil visualizações · dez/2025 · português · 10 min","f":"reajuste-repactuacao-reequilibrio"},{"k":"vídeo","t":"É possível reequilibrar uma ata de registro de preços?","why":"Reequilíbrio de ata de registro de preços; tema próximo do reequilíbrio em obra.","h":1,"u":"https://www.youtube.com/watch?v=G1rFZqRkh5E","pick":"P","src":"YouTube · 84,7 mil visualizações · fev/2026 · português · 13 min","f":"reajuste-repactuacao-reequilibrio"},{"k":"artigo","t":"TCU, Licitações e Contratos: reequilíbrio econômico-financeiro (recomposição ou revisão)","why":"Orientação do tribunal que fiscaliza.","h":1,"u":"https://licitacoesecontratos.tcu.gov.br/6-2-2-1-1-reequilibrio-economico-financeiro-recomposicao-ou-revisao-2","pick":"P","src":"TCU"},{"k":"pdf","t":"Reequilíbrio econômico-financeiro de contratos de obras públicas","why":"Estudo do TCU específico para obras.","h":1,"u":"https://portal.tcu.gov.br/data/files/0B/05/99/3A/2516E810943E72C8E18818A8/Reequilibrio%20economico-financeiro%20de%20contratos%20de%20obras%20publicas.pdf","pick":"P","src":"TCU"},{"k":"pdf","t":"Apostila técnica da aula 3 (PDF)","why":"Explica a aula e todas as técnicas, com o roteiro e as perguntas.","h":1,"u":"apostilas/aula-3.pdf","pick":"P","src":"Apostila do curso"},{"k":"pdf","t":"Ler as fichas em PDF desta aula","why":"Uma ficha por técnica, listadas no fim desta página.","h":1,"u":null,"pick":"P","src":"Fichas do curso"},{"k":"vídeo","t":"Nova Lei de Licitações e Contratos, Lei 14.133/2021, esquematizada (Estratégia Concursos)","why":"Aula longa (quase 4 horas) sobre toda a Lei 14.133; opcional.","h":0,"u":"https://www.youtube.com/watch?v=Pecf9lc-UGo","pick":"A","src":"YouTube · 245 mil visualizações · set/2026 · português · 3h55","f":"adm-contratual"},{"k":"artigo","t":"Lei 14.133 comentada: art. 124","why":"Comentário artigo por artigo.","h":0,"u":"https://www.tce.sp.gov.br/legislacao-comentada/lei-14133-1o-abril-2021/124","pick":"A","src":"TCE-SP"}],"q":["Quais as hipóteses de alteração unilateral e consensual do art. 124?","Quais os limites de acréscimos e supressões e a exceção para reforma?","Em que prazo e antes de qual evento o pedido de reequilíbrio deve ser feito?"],"sum":"Escreva: (1) a diferença entre reajuste, repactuação e reequilíbrio; (2) os limites de aditivo do art. 125; (3) quais documentos sustentam um pedido de reequilíbrio.","h":12},{"n":4,"t":"Pleito, notificação e registro contemporâneo","goal":"A aula que decide pleito: notificar no prazo, registrar o que aconteceu e provar o nexo.","intro":["Um pleito completo responde a quatro perguntas: o que aconteceu (evento), de quem é o risco (contrato), que efeito teve no prazo e no custo (nexo causal e quantificação) e o que se pede (prazo, valor ou ambos). Prazo e dinheiro são pedidos separados e se provam separados.","Notificação: quase todo contrato fixa um prazo para avisar a outra parte do evento. Perder esse prazo pode custar o direito, dependendo da cláusula e do que a lei permite. A ficha de notificação e preclusão trata desse risco.","Prova contemporânea é a que nasce no momento do fato: diário de obra, atas, e-mails, fotos datadas, cartas com protocolo, medições, atualizações de cronograma. Reconstruir depois é mais caro e mais fácil de contestar.","Não encontrei vídeo sobre pleito com mais de 10 mil visualizações e até 2 anos. Por isso esta aula se apoia na ficha, na apostila e no artigo da ABA; o vídeo sobre notificação, da aula 1, complementa."],"steps":[{"k":"vídeo","t":"Notificação extrajudicial: tudo o que você precisa saber","why":"Visto na aula 1: notificação extrajudicial.","h":0,"u":"https://www.youtube.com/watch?v=yqqXV593NAw","pick":"R","src":"YouTube · 13,5 mil visualizações · nov/2024 · português · 23 min","f":"notificacao-preclusao"},{"k":"artigo","t":"Delay Claims, Part II: Proving Delays, Required Documentation","why":"Artigo da ABA sobre a documentação necessária para provar atraso.","h":2,"u":"https://www.americanbar.org/groups/tort_trial_insurance_practice/resources/committee-articles/delay-claims-part-ii-proving-delays-required-documentation/","pick":"P","src":"ABA"},{"k":"pdf","t":"Apostila técnica da aula 4 (PDF)","why":"Explica a aula e todas as técnicas, com o roteiro e as perguntas.","h":2,"u":"apostilas/aula-4.pdf","pick":"P","src":"Apostila do curso"},{"k":"pdf","t":"Ler as fichas em PDF desta aula","why":"Uma ficha por técnica, listadas no fim desta página.","h":1,"u":null,"pick":"P","src":"Fichas do curso"},{"k":"curso","t":"Complemento FGV: Gestão de Disputas em Projetos de Infraestrutura (16 horas-aula)","why":"Curso curto de claims e disputas. Opcional, pago; confirme a próxima turma.","h":0,"u":"https://educacao-executiva.fgv.br/produto/gestao-de-disputas-em-projetos-de-infraestrutura-aspectos-teoricos-e-praticos-01tV200000Ij5RNIAZ","pick":"A","src":"FGV"}],"q":["Que registros contemporâneos provam a causa de um atraso?","Por que prazo e dinheiro precisam ser provados separadamente?"],"sum":"Escreva: (1) as quatro perguntas que um pleito completo responde; (2) o que é prova contemporânea e 4 exemplos; (3) o que pode acontecer se a notificação sair fora do prazo.","h":5},{"n":5,"t":"Cronograma e CPM: a base comum","goal":"Qualidade do cronograma, lógica, caminho crítico e folga. Análise de atraso sobre cronograma ruim produz número ruim.","intro":["O caminho crítico é a sequência de atividades que define a data final. Atrasar uma atividade crítica atrasa a obra. Folga total é quanto uma atividade pode atrasar sem atrasar o término; folga livre é quanto pode atrasar sem atrasar a sucessora.","Antes de qualquer análise, audite o cronograma: lógica aberta (atividades sem predecessora ou sucessora), restrições de data que forçam o caminho crítico, folga negativa, calendários inconsistentes e relações em excesso. Cada defeito dá ao outro lado um argumento contra a sua análise. A avaliação em 14 pontos da DCMA e o guia de avaliação de cronograma do GAO são referências usadas para isso.","A AACE publica práticas recomendadas de cronograma: lógica das atividades (RP 24R-03), identificação do caminho crítico (49R-06), documentação da base do cronograma (38R-06) e níveis de detalhe (37R-06). O PMI complementa com o Practice Standard for Scheduling."],"steps":[{"k":"vídeo","t":"Cronograma de obras: guia passo a passo dos caminhos críticos (Tim Fairley)","why":"Guia longo de cronograma de obras e caminhos críticos.","h":2,"u":"https://www.youtube.com/watch?v=IDaDI18u3Fw","pick":"P","src":"YouTube · 10,9 mil visualizações · abr/2026 · inglês · 1h43","f":"cpm-folgas"},{"k":"vídeo","t":"Verificação de cronograma DCMA 14 pontos no Primavera P6","why":"Verificação de qualidade do cronograma (DCMA 14 pontos) no Primavera P6.","h":1,"u":"https://www.youtube.com/watch?v=V0-o6nOlaK8","pick":"P","src":"YouTube · 10,1 mil visualizações · ago/2025 · inglês · 37 min","f":"auditoria-cronograma"},{"k":"pdf","t":"GAO Schedule Assessment Guide","why":"Guia público de avaliação de cronograma, com boas práticas de qualidade.","h":2,"u":"https://www.gao.gov/assets/d1689G.pdf","pick":"P","src":"GAO"},{"k":"norma","t":"PMI, Practice Standard for Scheduling, 3ª ed.","why":"Página do PMI. Confirme se a edição alinha ao PMBOK 6 ou 7.","h":3,"u":"https://www.pmi.org/pt-br/standards/scheduling-third-edition","pick":"P","src":"PMI"},{"k":"pdf","t":"Apostila técnica da aula 5 (PDF)","why":"Explica a aula e todas as técnicas, com o roteiro e as perguntas.","h":2,"u":"apostilas/aula-5.pdf","pick":"P","src":"Apostila do curso"},{"k":"pdf","t":"Ler as fichas em PDF desta aula","why":"Uma ficha por técnica, listadas no fim desta página.","h":1,"u":null,"pick":"P","src":"Fichas do curso"},{"k":"vídeo","t":"Método do Caminho Crítico (CPM) de forma simples","why":"Visto na aula 1: CPM e folgas.","h":0,"u":"https://www.youtube.com/watch?v=ijZ8AISuYZo","pick":"R","src":"YouTube · 66 mil visualizações · mar/2025 · inglês · 24 min","f":"cpm-folgas"},{"k":"artigo","t":"AACE RP 49R-06: identificação do caminho crítico e folga (guia de estudo)","why":"Resumo de terceiros sobre a RP 49R-06. Confirme na fonte da AACE.","h":0,"u":"https://open-exam-prep.com/study-guides/aace-psp/cpm-mechanics/float-calculations-critical-path-rp49r06","pick":"A","src":"Guia de estudo"}],"q":["O que diferencia folga total de folga livre?","Quais defeitos de lógica invalidam um cronograma como base de análise?","Como restrições de data distorcem o caminho crítico?"],"sum":"Escreva: (1) o que é caminho crítico e folga total e livre; (2) a lista dos defeitos de cronograma que você verificaria antes de analisar um atraso; (3) por que um cronograma ruim contamina a análise.","h":11},{"n":6,"t":"Análise de atraso: AACE RP 29R-03","goal":"Os nove métodos, como escolher entre eles e como são aplicados. Núcleo técnico do curso.","intro":["A RP 29R-03 descreve nove métodos de análise forense de cronograma, os MIPs 3.1 a 3.9, e os fatores para escolher entre eles. A norma não manda usar um método; exige que a escolha seja justificada. Foi publicada em 2007 e revisada em 2009 e 2011, e há rascunho de atualização em discussão: confirme a versão vigente no site da AACE. O texto completo é para membros ou compra; os links desta aula levam ao sumário e a leituras de apoio.","Os nove métodos: 3.1 observacional, estático, bruto (planejado contra realizado); 3.2 observacional, estático, periódico; 3.3 observacional, dinâmico, contemporâneo como está; 3.4 observacional, dinâmico, contemporâneo dividido; 3.5 observacional, dinâmico, modificado ou recriado; 3.6 modelado, aditivo, base única; 3.7 modelado, aditivo, bases múltiplas; 3.8 modelado, subtrativo, simulação única; 3.9 modelado, subtrativo, bases múltiplas.","Como ler a classificação: observacional compara cronogramas sem inserir ou retirar atrasos; modelado simula. Estático usa duas fotografias; dinâmico usa a sequência de atualizações. Aditivo insere os atrasos num cronograma; subtrativo os retira do cronograma real (o clássico collapsed as-built).","Posição prática: se o projeto tem atualizações mensais confiáveis, o método por janelas (observacional dinâmico, MIP 3.3) costuma ser o mais defensável. Se não tem, a escolha passa a ser um problema de dados. A crítica comum aos métodos modelados é a dependência de premissas do analista."],"steps":[{"k":"vídeo","t":"Time Impact Analysis (TIA) na prática no Primavera P6","why":"Análise de atraso (TIA) na prática no Primavera P6; tema próximo dos métodos da 29R-03.","h":1,"u":"https://www.youtube.com/watch?v=4wikVvRMEo8","pick":"P","src":"YouTube · 10,4 mil visualizações · mar/2025 · inglês · 28 min","f":"delay-visao-geral"},{"k":"pdf","t":"Sumário da RP 29R-03","why":"Mostra a estrutura dos nove métodos.","h":1,"u":"https://web.aacei.org/docs/default-source/toc/toc_29r-03.pdf?sfvrsn=4","pick":"P","src":"AACE"},{"k":"livro","t":"Construction Delay Claims (Bramble e Callahan), capítulos de análise de atraso","why":"Referência clássica. Página de livraria; confirme a edição.","h":4,"u":"https://readings.com.au/product/9781543823653/construction-delay-claims--barry-b-bramble-michael-t-callahan--2020--9781543823653","pick":"P","src":"Livraria"},{"k":"artigo","t":"Understanding Construction Scheduling","why":"Artigo da ABA que cita AACE 29R-03 e o protocolo SCL como referências.","h":1,"u":"https://www.americanbar.org/groups/tort_trial_insurance_practice/resources/journal/2022-fall/understanding-construction-scheduling","pick":"P","src":"ABA"},{"k":"pdf","t":"Apostila técnica da aula 6 (PDF)","why":"Explica a aula e todas as técnicas, com o roteiro e as perguntas.","h":4,"u":"apostilas/aula-6.pdf","pick":"P","src":"Apostila do curso"},{"k":"pdf","t":"Ler as fichas em PDF desta aula","why":"Uma ficha por técnica, listadas no fim desta página.","h":1,"u":null,"pick":"P","src":"Fichas do curso"},{"k":"vídeo","t":"Fragnet e Time Impact Analysis (TIA) no Primavera P6 (outra explicação)","why":"Visto na aula 1: análise de atraso.","h":0,"u":"https://www.youtube.com/watch?v=a-pl85wE-t8","pick":"R","src":"YouTube · 13,3 mil visualizações · mar/2026 · inglês · 18 min","f":"tia"},{"k":"artigo","t":"Alternativa: crítica à revisão da 29R-03","why":"Mostra o debate sobre os métodos modelados.","h":0,"u":"https://enr.com/articles/56770-forensic-schedulings-groundhog-day-dubious-practices-recommended-again","pick":"A","src":"ENR"},{"k":"curso","t":"Meta de certificação: AACE PSP, EVP e CCP","why":"Certificações da AACE em planejamento, valor agregado e custos. Opcional.","h":0,"u":"https://web.aacei.org/certification/certifications-offered/professional-certifications","pick":"A","src":"AACE"}],"q":["Cite os nove métodos da 29R-03 e a família a que cada um pertence.","Que qualidade de dados cada método exige?","Por que um método modelado e aditivo é mais contestável que um observacional?"],"sum":"Escreva: (1) os nove métodos e como se classificam; (2) como escolher entre eles; (3) em que situações você usaria janelas (MIP 3.3) e em que situações não; (4) as limitações de cada família.","h":12},{"n":7,"t":"TIA prospectivo e atraso concorrente","goal":"Impacto de tempo prospectivo e o confronto entre a AACE e o protocolo SCL.","intro":["O TIA (Time Impact Analysis) insere um evento no cronograma vigente para medir o efeito no término. A RP 52R-06 trata da versão prospectiva, feita durante a obra, para pedir prorrogação antes de o atraso se consumar. A própria norma avisa que quanto maior o intervalo entre o evento e a aprovação do TIA, menos útil e válida ele é.","Atraso concorrente é quando duas ou mais causas, de partes diferentes, atrasam o término no mesmo período. O tratamento varia por contrato, por jurisdição e por protocolo. O protocolo da Society of Construction Law (2ª edição, 2017) e a AACE divergem em alguns pontos; estudar a divergência é mais útil que escolher um lado.","No Brasil, a regra prática é ler o seu contrato: ele diz de quem é a folga, se há prorrogação sem custo para atraso concorrente e como se prova. O protocolo SCL não tem força de lei, a menos que o contrato o adote."],"steps":[{"k":"vídeo","t":"Fragnet e Time Impact Analysis (TIA) no Primavera P6, passo a passo","why":"Fragnet e TIA no Primavera P6, passo a passo.","h":1,"u":"https://www.youtube.com/watch?v=gMIh9_62LDk","pick":"P","src":"YouTube · 26,4 mil visualizações · fev/2026 · inglês · 17 min","f":"tia"},{"k":"artigo","t":"Harmonizing SCL DDP2 and AACE 29R-03","why":"Compara os dois documentos.","h":1,"u":"https://www.mondaq.com/unitedstates/arbitration-dispute-resolution/1702390/harmonizing-scl-dd2-and-aace-29r-03-complementary-frameworks-for-forensic-delay-analysis-in-international-arbitration","pick":"P","src":"Mondaq"},{"k":"artigo","t":"Prospective Time Impact Analysis in Forensics: a case study","why":"Caso prático.","h":1,"u":"https://ankura.com/insights/prospective-time-impact-analysis-in-forensics-a-case-study","pick":"P","src":"Ankura"},{"k":"pdf","t":"TIA Speaker Series (apresentação da CDM Smith)","why":"Apresentação em PDF sobre Time Impact Analysis.","h":1,"u":"https://cdmsmith.com/-/media/PowerPoint/TIA-Speaker-Series.pdf","pick":"P","src":"CDM Smith"},{"k":"pdf","t":"Apostila técnica da aula 7 (PDF)","why":"Explica a aula e todas as técnicas, com o roteiro e as perguntas.","h":3,"u":"apostilas/aula-7.pdf","pick":"P","src":"Apostila do curso"},{"k":"pdf","t":"Ler as fichas em PDF desta aula","why":"Uma ficha por técnica, listadas no fim desta página.","h":2,"u":null,"pick":"P","src":"Fichas do curso"},{"k":"vídeo","t":"TIA parte 2: Visualizer no Primavera P6, mostrando o impacto do atraso","why":"Visto na aula 1: TIA, parte 2.","h":0,"u":"https://www.youtube.com/watch?v=zpgf-U-2Ero","pick":"R","src":"YouTube · 23,4 mil visualizações · mar/2026 · inglês · 15 min","f":"tia"},{"k":"artigo","t":"The SCL Delay and Disruption Protocol: a second edition","why":"Resumo do que mudou na segunda edição.","h":0,"u":"https://www.fenwickelliott.com/research-insight/annual-review/2017/scl-delay-disruption-protocol-second-edition","pick":"A","src":"Fenwick Elliott"},{"k":"artigo","t":"SCL Delay and Disruption Protocol: take two","why":"Comentário sobre a segunda edição.","h":0,"u":"https://www.building.co.uk/communities/scl-delay-and-disruption-protocol-take-two/5082412.article","pick":"A","src":"Building"}],"q":["Quando um TIA prospectivo é melhor que uma análise retrospectiva?","Como o protocolo SCL e a AACE tratam o atraso concorrente?","De quem é a folga no seu contrato?"],"sum":"Escreva: (1) o que é TIA e quando é prospectivo ou retrospectivo; (2) o que é atraso concorrente e como o tratamento varia; (3) onde SCL e AACE divergem; (4) o que você precisa ler no seu contrato para decidir.","h":9},{"n":8,"t":"Quantum: BDI, produtividade e valor agregado","goal":"Transformar atraso e mudança em valor defensável.","intro":["Quantum é o valor do pleito. Separe três componentes: custo direto da mudança, custo de atraso (manter a obra ativa por mais tempo: administração local, canteiro, equipamentos) e perda de produtividade (mesmo trabalho exigindo mais horas por interferência).","BDI: ao precificar aditivos, use o BDI do contrato e confronte com a faixa do Acórdão 2622/2013 do TCU quando o objeto for obra pública. O acórdão fixou faixas de referência por tipo de obra. Um vídeo da busca cita o Acórdão 2340/2024 sobre BDI diferenciado de equipamentos: confira se ele alterou algo do 2622.","Perda de produtividade é a parte mais difícil de provar. O método do Measured Mile compara a produtividade num trecho afetado com a de um trecho comparável sem interferência. A RP 25R-03 da AACE trata da estimativa de perda de produtividade em claims; segundo um artigo da FTI, ela aponta o Measured Mile e a análise de valor agregado como métodos preferidos. A RP é de 2004 e há relato não confirmado de atualização: confira no site da AACE.","Valor agregado (EVM) compara previsto (PV), realizado em valor (EV) e custo real (AC). SPI é EV dividido por PV e mede prazo; CPI é EV dividido por AC e mede custo. É ferramenta de controle e dá sinal precoce de desvio; não prova nexo causal sozinho."],"steps":[{"k":"artigo","t":"Assessing Loss of Productivity in Construction: The Importance of Contemporaneous Documentation","why":"Artigo que discute os métodos da RP 25R-03 e a documentação necessária.","h":1,"u":"https://www.fticonsulting.com/insights/articles/assessing-loss-productivity-construction-contemporaneous-documentation","pick":"P","src":"FTI Consulting"},{"k":"pdf","t":"Productivity Claims (artigo para advogados de construção)","why":"Texto da AGC sobre claims de produtividade.","h":1,"u":"https://www.agc.org/sites/default/files/users/user22628/CLE%20Paper_%20Productivity%20Claims%20.pdf","pick":"P","src":"AGC"},{"k":"norma","t":"PMI, Standard for Earned Value Management (2020)","why":"Norma atual de EVM do PMI.","h":2,"u":"https://www.pmi.org/fr-fr/standards/earned-value-management","pick":"P","src":"PMI"},{"k":"pdf","t":"Acórdão 2622/2013-TCU-Plenário: parâmetros de BDI","why":"Leia a parte dispositiva e as tabelas de faixas.","h":1,"u":"https://www.mpf.mp.br/o-mpf/unidades/pr-to/transparencia/licitacoes-novo/2016/12Acordao26222013BDI.pdf","pick":"P","src":"cópia no MPF"},{"k":"pdf","t":"Apostila técnica da aula 8 (PDF)","why":"Explica a aula e todas as técnicas, com o roteiro e as perguntas.","h":3,"u":"apostilas/aula-8.pdf","pick":"P","src":"Apostila do curso"},{"k":"pdf","t":"Ler as fichas em PDF desta aula","why":"Uma ficha por técnica, listadas no fim desta página.","h":1,"u":null,"pick":"P","src":"Fichas do curso"},{"k":"vídeo","t":"Valor Agregado (EVM) explicado em 11 minutos","why":"Visto na aula 1: valor agregado.","h":0,"u":"https://www.youtube.com/watch?v=vyT2YrgHHJo","pick":"R","src":"YouTube · 33,5 mil visualizações · nov/2025 · inglês · 11 min","f":"evm"}],"q":["Como separar custo direto, custo de atraso e perda de produtividade?","O que é o método do Measured Mile e quando ele não se aplica?","O que o PV, EV e AC dizem sobre desvio de prazo e custo?"],"sum":"Escreva: (1) os três componentes do quantum; (2) como o BDI e o Acórdão 2622/2013 entram no cálculo; (3) como funciona o Measured Mile e suas limitações; (4) o que EV, PV, AC, SPI e CPI medem.","h":9},{"n":9,"t":"Dispute Boards no Brasil","goal":"Regras da ICC e do CBMA, Lei 14.133 e a eficácia da decisão do comitê.","intro":["Dispute Board é um comitê, em geral de três profissionais, que acompanha o contrato e resolve divergências durante a obra. Nas regras da ICC de 2015 há três modelos: DRB (Dispute Review Board), que emite recomendações que só vinculam se ninguém objetar em 30 dias; DAB (Dispute Adjudication Board), que emite decisões de cumprimento imediato; e CDB (Combined Dispute Board), que combina os dois.","As regras da ICC organizam o trabalho do comitê em três serviços: prevenção de divergências (avoidance), assistência informal e referência formal para uma conclusão. A função preventiva é a que mais evita disputa. Um comitê que só se reúne na crise perde o principal valor.","No Brasil, a Lei 14.133 prevê meios alternativos de solução de controvérsias, incluindo comitê de resolução de disputas, nos arts. 151 a 154. O regulamento de arbitragem do CBMA de 2025 trata de arbitragem, mediação e dispute board. O CAM-CCBC também tem regulamento próprio de dispute board, que não localizei como página oficial: a aula indica trabalhos acadêmicos que o analisam. O Enunciado 6 da I Jornada de Prevenção e Solução Extrajudicial de Litígios do CJF trata o comitê de resolução de disputas como método consensual de solu function plan(){

  const days=Math.floor((Date.now()-start.getTime())/86400000);

    <h2 class="sec">PDFs técnicos das aulas</h2>
    <div class="pdfs">${LESSONS.map(L=>`<a href="apostilas/aula-${L.n}.pdf" target="_blank" rel="noopener noreferrer">Aula ${L.n}: ${L.t}<small>PDF técnico da aula</small></a>`).join("")}</div>
    <p class="foot"><b>Como foram escolhidos os vídeos.</b> Só entram vídeos com mais de 10 mil visualizações e publicados há no máximo 2 anos (depois de 21/11/2024), em qualquer idioma. Conferi as visualizações e a data em 21/11/2026, direto nas páginas do YouTube; esses números mudam. Não assisti aos vídeos: escolhi pelo tema e pelo título. Para vários temas não há nenhum vídeo que passe no filtro, e a página diz isso. Os botões abrem páginas diretas; os links das leituras não foram abertos por dentro. Textos completos da AACE e livros são pagos ou exclusivos de membros: quando não há texto público, a aula leva ao sumário, a materiais da própria AACE ou a análises de terceiros, e diz isso. O texto das aulas foi escrito por mim a partir do que conheço e do que a pesquisa trouxe: confirme na fonte antes de citar. Este painel não substitui parecer jurídico. As fichas em PDF foram escritas por mim para este curso, a partir de conhecimento geral e dos materiais indicados; não são cópias de normas. Seu progresso e seus resumos ficam salvos só neste navegador.</p>
  </div></main>`;
  const si=document.getElementById("start"),hi=document.getElementById("hpw");
  si.addEventListener("change",()=>{if(si.value){st.start=si.value;save();home();top_()}});
  hi.addEventListener("change",()=>{st.hpw=Math.max(1,Math.min(60,Number(hi.value)||10));save();home();top_()});
}

function stepHTML(s){
  const k=s.k==="vídeo"?"v":"";
  const label=s.k==="vídeo"?"Assistir ↗":s.k==="livro"?"Ver livro ↗":"Abrir ↗";
  const main=s.u?`<a class="go ${s.pick==="A"||s.pick==="R"?"alt":""}" href="${s.u}" target="_blank" rel="noopener noreferrer">${label}</a>`:"";
  const pdf=s.f?`<a class="go pdfb" href="fichas/${s.f}.pdf" target="_blank" rel="noopener noreferrer" title="${esc(FT[s.f]||"")}">PDF da técnica ↗</a>`:"";
  const pk=s.pick==="P"?`<span class="pick">Principal</span>`:s.pick==="A"?`<span class="pick alt">Alternativa</span>`:s.pick==="R"?`<span class="pick alt">Revisão</span>`:"";
  return `<li class="step ${st.done[s.id]?"done":""}">
    <input class="c" type="checkbox" id="${s.id}" ${st.done[s.id]?"checked":""} aria-label="Marcar como feito: ${esc(s.t)}">
    <div><div><span class="kind ${k}">${KL[s.k]||s.k}</span>${pk}</div>
      <div class="tt">${s.t}</div>
      ${s.why?`<p class="why">${s.why}</p>`:""}
      <div class="mt"><span>${s.h?s.h+" h (estimativa)":(s.pick==="R"?"revisão, fora das 100 h":"opcional, fora das 100 h")}</span>${s.src?`<span>${s.src}</span>`:""}${s.f?`<span>Ficha: ${FT[s.f]||s.f}</span>`:""}</div>
    </div><div class="act">${main}${pdf}</div></li>`;
}

function diagHTML(L){
  const rated=DIAG.filter(d=>st.diag[d.k]);
  let res=`<p class="hint">Para cada competência: assista ao vídeo, leia a ficha em PDF e dê a sua nota de 1 (nunca vi) a 5 (faço sozinho). O resultado aparece quando as nove tiverem nota.</p>`;
  if(rated.length===DIAG.length){
    const sorted=[...DIAG].sort((a,b)=>st.diag[a.k]-st.diag[b.k]);
    const low=sorted.slice(0,3);
    const avg=(DIAG.reduce((a,d)=>a+st.diag[d.k],0)/DIAG.length).toFixed(1).replace(".",",");
    res=`<div class="res"><b>Média: ${avg} de 5.</b> Reforce primeiro: ${low.map(d=>`<a href="#aula-${d.a}">aula ${d.a}</a> (${d.t.toLowerCase()}, nota ${st.diag[d.k]})`).join("; ")}. Reserve mais tempo nelas e passe rápido pelas de nota 4 ou 5. Se a análise de atraso (aula 6) ficou abaixo de 3, não corte nada dela: é o núcleo do curso.</div>`;
  }
  return `<div class="aula" style="margin-top:1rem"><h2>Diagnóstico das 9 competências</h2>
  ${DIAG.map((d,i)=>{const s=L.steps.find(x=>x.d===d.k);return `<div class="dg">
    <h3>${i+1}. ${d.t}</h3><p class="x">${d.x}</p>
    <div class="dga"><label><input class="c" type="checkbox" id="${s.id}" ${st.done[s.id]?"checked":""}> ${s.u?"Assisti ("+s.h+" h)":"Li a ficha"}</label>
      ${s.u?`<a class="go" href="${s.u}" target="_blank" rel="noopener noreferrer">Assistir: ${s.t} ↗</a>`:`<span class="hint">Nenhum vídeo com mais de 10 mil visualizações e até 2 anos foi encontrado para este tema.</span>`}
      <a class="go pdfb" href="fichas/${d.f}.pdf" target="_blank" rel="noopener noreferrer">PDF da técnica ↗</a></div>
    ${s.u?`<p class="hint">${s.src}</p>`:""}
    <div class="sc" role="group" aria-label="Nota para ${esc(d.t)}">${[1,2,3,4,5].map(n=>`<button type="button" data-k="${d.k}" data-v="${n}" aria-pressed="${st.diag[d.k]===n}">${n}</button>`).join("")}</div>
  </div>`}).join("")}${res}</div>`;
}

function lesson(n){
  const L=LESSONS.find(x=>x.n===n);if(!L){home();return}
  const prev=LESSONS.find(x=>x.n===n-1),nx=LESSONS.find(x=>x.n===n+1);
  const nv=L.steps.filter(s=>s.k==="vídeo"&&s.h).length;
  const nr=L.steps.filter(s=>["pdf","livro","norma","artigo"].includes(s.k)&&s.h).length;
  app.innerHTML=`
  <section class="lh gut"><div class="in">
    <a class="back" href="#">← todas as aulas</a>
    <h1><span class="n">${L.n}</span>${L.t}</h1>
    <p>${L.goal}</p>
    <div class="chips"><span class="chip">${L.h} h</span><span class="chip">${nv} vídeo${nv===1?"":"s"}</span><span class="chip">${nr} leitura${nr===1?"":"s"}</span><span class="chip">${pad(doneH(L))} h feitas</span></div>
    <p style="margin-top:1.1rem"><a class="go" href="apostilas/aula-${L.n}.pdf" target="_blank" rel="noopener noreferrer">PDF técnico da aula ↗</a></p>
  </div></section>
  <main class="gut body"><div class="in">
    <div class="apost"><div><b>PDF técnico da aula ${L.n}</b><span>Apostila que explica a aula: texto, todas as técnicas, roteiro com links e perguntas.</span></div><a class="go" href="apostilas/aula-${L.n}.pdf" target="_blank" rel="noopener noreferrer">Abrir PDF técnico ↗</a></div>
    <div class="aula"><h2>A aula</h2>${L.intro.map(p=>`<p>${p}</p>`).join("")}</div>
    ${n===1?diagHTML(L):""}
    <h2 class="sub">Roteiro de estudo</h2>
    <p class="subp">Faça na ordem. Marque cada item ao terminar. Os itens "Alternativa" são opcionais.</p>
    ${SEEN[n]?`<p class="subp">Já visto na aula 1, por isso não repetido aqui: ${SEEN[n]}.</p>`:""}
    <ol class="steps">${L.steps.filter(x=>!x.d).map(stepHTML).join("")}</ol>
    <h2 class="sub">Fichas em PDF desta aula</h2>
    <p class="subp">Cada técnica tem uma apostila em PDF e, quando existe, um vídeo do mesmo tema. O vídeo não precisa seguir o texto da apostila. Foram escritas para este curso; confirme na fonte antes de citar.</p>
    <div class="fich2">${fichasOf(L).map(f=>`<div class="fi"><a href="fichas/${f}.pdf" target="_blank" rel="noopener noreferrer">${FT[f]||f}<small>Apostila: ficha em PDF</small></a>${vidLine(f)}</div>`).join("")}</div>
    <details class="blk"><summary>Para pensar: ${L.q.length} perguntas (sem escrever)</summary><div><ol>${L.q.map(q=>`<li>${q}</li>`).join("")}</ol><p class="hint">Responda de memória, depois confira na fonte. Sem gabarito de propósito.</p></div></details>
    <section class="resumo"><h2>${n===10?"Resumo final":"Meu resumo da aula "+L.n}</h2>
      <p class="hint">${L.sum}</p>
      <textarea id="nt" aria-label="Resumo da aula ${L.n}" placeholder="Escreva com as suas palavras o que você aprendeu..."></textarea>
      <div class="cnt" id="wc"></div></section>
    <nav class="pn">${prev?`<a href="#aula-${prev.n}"><small>← anterior</small>Aula ${prev.n}: ${prev.t}</a>`:`<a href="#"><small>← início</small>Todas as aulas</a>`}${nx?`<a class="r" href="#aula-${nx.n}"><small>próxima →</small>Aula ${nx.n}: ${nx.t}</a>`:`<a class="r" href="#"><small>fim →</small>Todas as aulas</a>`}</nav>
  </div></main>`;
  app.querySelectorAll("input.c").forEach(cb=>cb.addEventListener("change",e=>{
    if(e.target.checked)st.done[e.target.id]=1;else delete st.done[e.target.id];
    save();const y=window.scrollY;lesson(n);top_();window.scrollTo(0,y)}));
  app.querySelectorAll(".sc button").forEach(b=>b.addEventListener("click",()=>{
    st.diag[b.dataset.k]=Number(b.dataset.v);save();const y=window.scrollY;lesson(n);window.scrollTo(0,y)}));
  const ta=document.getElementById("nt"),wc=document.getElementById("wc");
  ta.value=st.notes[n]||"";
  const upd=()=>{wc.textContent=words(ta.value)+" palavras"+(words(ta.value)>=30?" · resumo registrado":" · escreva ao menos 30 palavras para registrar")};
  upd();
  ta.addEventListener("input",()=>{st.notes[n]=ta.value;save();upd()});
}

function top_(){document.getElementById("topst").textContent=pad(allDoneH())+" / "+TOTAL+" h"}
function route(){
  const m=/^#aula-(\d+)$/.exec(location.hash);
  if(m)lesson(Number(m[1]));else home();
  top_();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
