    res=`<div class="res"><b>Média: ${avg} de 5.</b> Reforce primeiro: ${low.map(d=>`<a href="#aula-${d.a}">aula ${d.a}</a> (${d.t.toLowerCase()}, nota ${st.diag[d.k]})`).join("; ")}. Reserve mais tempo nelas e passe rápido pelas de nota 4 ou 5. Se a análise de atraso (aula 6) ficou abaixo de 3, não corte nada dela: é o núcleo do curso.</div>`;
  }
  return `<div class="aula" style="margin-top:1rem"><h2>Diagnóstico das 9 competências</h2>
  ${DIAG.map((d,i)=>{const s=L.steps.find(x=>x.d===d.k);return `<div class="dg">
    <h3>${i+1}. ${d.t}</h3><p class="x">${d.x}</p>
    <div class="dga"><label><input class="c" type="checkbox" id="${s.id}" ${st.done[s.id]?"checked":""}> ${s.k==="vídeo"?"Assisti ("+s.h+" h)":"Li o texto"}</label>
      ${s.k==="vídeo"?`<a class="go" href="${s.u}" target="_blank" rel="noopener noreferrer">Assistir: ${s.t} ↗</a>`:`<span class="hint">Nenhum vídeo com mais de 10 mil visualizações, até 2 anos e pelo menos 10 minutos foi encontrado para este tema.</span>`}
      <a class="go pdfb" href="#ficha-${d.f}">Ler o texto da técnica →</a></div>
    ${s.k==="vídeo"?`<p class="hint">${s.src}</p>`:""}
    <div class="sc" role="group" aria-label="Nota para ${esc(d.t)}">${[1,2,3,4,5].map(n=>`<button type="button" data-k="${d.k}" data-v="${n}" aria-pressed="${st.diag[d.k]===n}">${n}</button>`).join("")}</div>
  </div>`}).join("")}${res}</div>`;
}

const li_=a=>"<ul>"+a.map(x=>`<li>${x}</li>`).join("")+"</ul>";
const fichaBody=f=>`<h2>O que é</h2><p>${f.o}</p><h2>Quando usar</h2><p>${f.q}</p><h2>Como fazer</h2>${li_(f.c)}<h2>Erros comuns</h2>${li_(f.e)}<h2>Para confirmar na fonte</h2><p>${f.f}</p>`;
const FM=Object.fromEntries(FICHAS.map(f=>[f.id,f]));
const lessonOf=id=>{const k=Object.keys(LF).find(x=>LF[x].includes(id));return k?Number(k):1};
const DISC=`<p class="hint">Texto elaborado para este curso, a partir de conhecimento geral e dos materiais indicados. Não substitui a norma, o contrato nem parecer jurídico. Confirme prazos, artigos e edições na fonte oficial antes de citar.</p>`;

function fichaPage(id){
  const f=FM[id];if(!f){home();return}
  const n=lessonOf(id);
  app.innerHTML=`<section class="lh gut"><div class="in"><a class="back" href="#aula-${n}">← voltar à aula ${n}</a>
    <h1>${f.t}</h1><p>Texto da técnica. Para voltar ao vídeo ou aos links, use o botão de voltar à aula.</p></div></section>
  <main class="gut body"><div class="in"><div class="aula">${fichaBody(f)}${DISC}</div>
    <h2 class="sub">Vídeos deste tema</h2><div class="fi">${vidLine(id)}</div>
    <nav class="pn"><a href="#aula-${n}"><small>← voltar</small>Aula ${n}: ${LESSONS.find(x=>x.n===n).t}</a></nav></div></main>`;
}

function textoPage(n){
  const L=LESSONS.find(x=>x.n===n);if(!L){home();return}
  const diag=n===1?`<h2>As nove competências do diagnóstico</h2>`+li_(DIAG.map(d=>`<b>${d.t}.</b> ${d.x} Aula de reforço: ${d.a}.`)):"";
  const tecs=fichasOf(L).map(id=>FM[id]).filter(Boolean).map(f=>`<div class="aula" style="margin-top:1rem"><h2 style="font-size:1.4rem">${f.t}</h2>${fichaBody(f)}<div class="fi" style="margin-top:.8rem">${vidLine(f.id)}</div></div>`).join("");
  const rot=L.steps.filter(s=>s.u&&!s.u.startsWith("#")).map(s=>`<li><b>${KL[s.k]||s.k}</b>: <a href="${s.u}" target="_blank" rel="noopener noreferrer">${s.t}</a> <span class="vm">${s.h?s.h+" h":(s.pick==="R"?"revisão":"opcional")}${s.src?" · "+s.src:""}</span></li>`).join("");
  app.innerHTML=`<section class="lh gut"><div class="in"><a class="back" href="#aula-${n}">← voltar à aula ${n}</a>
    <h1><span class="n">${L.n}</span>Texto técnico: ${L.t}</h1><p>${L.goal}</p></div></section>
  <main class="gut body"><div class="in">
    <div class="aula"><h2>1. A aula</h2>${L.intro.map(p=>`<p>${p}</p>`).join("")}${diag}</div>
    <h2 class="sub">2. As técnicas desta aula</h2>${tecs}
    <div class="aula" style="margin-top:1rem"><h2>3. Roteiro de estudo e fontes</h2><ul class="rot">${rot}</ul>
      <h2>4. Para pensar (sem escrever)</h2>${li_(L.q)}<h2>5. Seu resumo da aula</h2><p>${L.sum}</p>${DISC}</div>
    <nav class="pn"><a href="#aula-${n}"><small>← voltar</small>Aula ${n}: ${L.t}</a></nav></div></main>`;
}

function lesson(n){
  const L=LESSONS.find(x=>x.n===n);if(!L){home();return}
  const prev=LESSONS.find(x=>x.n===n-1),nx=LESSONS.find(x=>x.n===n+1);
  const nv=L.steps.filter(s=>s.k==="vídeo"&&s.h).length;
  const nr=L.steps.filter(s=>["pdf","livro","norma","artigo"].includes(s.k)&&s.h).length;
  app.innerHTML=`
  <section class="lh gut"><div class="in">
    <a class="back" href="#">← todas as aulas</a>
    <h1><span class="n">${L.n}</span>${L.t}</h1>
    <p>${L.goal}</p>
    <div class="chips"><span class="chip">${L.h} h</span><span class="chip">${nv} vídeo${nv===1?"":"s"}</span><span class="chip">${nr} leitura${nr===1?"":"s"}</span><span class="chip">${pad(doneH(L))} h feitas</span></div>
    <p style="margin-top:1.1rem"><a class="go" href="#texto-${L.n}">Texto técnico da aula →</a></p>
  </div></section>
  <main class="gut body"><div class="in">
    <div class="apost"><div><b>Texto técnico da aula ${L.n}</b><span>Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.</span></div><a class="go" href="#texto-${L.n}">Ler o texto →</a></div>
    <div class="aula"><h2>A aula</h2>${L.intro.map(p=>`<p>${p}</p>`).join("")}</div>
    ${n===1?diagHTML(L):""}
    <h2 class="sub">Roteiro de estudo</h2>
    <p class="subp">Faça na ordem. Marque cada item ao terminar. Os itens "Alternativa" são opcionais. Os vídeos podem estar em inglês: ative a legenda e a tradução automática no YouTube.</p>
    <ol class="steps">${L.steps.filter(x=>!x.d).map(stepHTML).join("")}</ol>
    <h2 class="sub">Textos das técnicas desta aula</h2>
    <p class="subp">Cada técnica tem um texto que abre aqui mesmo e, quando existe, um vídeo do mesmo tema. O vídeo não precisa seguir o texto.</p>
    <div class="fich2">${fichasOf(L).map(f=>`<div class="fi"><a href="#ficha-${f}">${FT[f]||f}<small>Texto da técnica →</small></a>${vidLine(f)}</div>`).join("")}</div>
    <details class="blk"><summary>Para pensar: ${L.q.length} perguntas (sem escrever)</summary><div><ol>${L.q.map(q=>`<li>${q}</li>`).join("")}</ol><p class="hint">Responda de memória, depois confira na fonte. Sem gabarito de propósito.</p></div></details>
    <section class="resumo"><h2>${n===10?"Resumo final":"Meu resumo da aula "+L.n}</h2>
      <p class="hint">${L.sum}</p>
      <textarea id="nt" aria-label="Resumo da aula ${L.n}" placeholder="Escreva com as suas palavras o que você aprendeu..."></textarea>
      <div class="cnt" id="wc"></div></section>
    <nav class="pn">${prev?`<a href="#aula-${prev.n}"><small>← anterior</small>Aula ${prev.n}: ${prev.t}</a>`:`<a href="#"><small>← início</small>Todas as aulas</a>`}${nx?`<a class="r" href="#aula-${nx.n}"><small>próxima →</small>Aula ${nx.n}: ${nx.t}</a>`:`<a class="r" href="#"><small>fim →</small>Todas as aulas</a>`}</nav>
  </div></main>`;
  app.querySelectorAll("input.c").forEach(cb=>cb.addEventListener("change",e=>{
    setDone(e.target.id,e.target.checked);
    const y=window.scrollY;lesson(n);top_();window.scrollTo(0,y)}));
  app.querySelectorAll(".sc button").forEach(b=>b.addEventListener("click",()=>{
    st.diag[b.dataset.k]=Number(b.dataset.v);save();const y=window.scrollY;lesson(n);window.scrollTo(0,y)}));
  const ta=document.getElementById("nt"),wc=document.getElementById("wc");
  ta.value=st.notes[n]||"";
  const upd=()=>{wc.textContent=words(ta.value)+" palavras"+(words(ta.value)>=30?" · resumo registrado":" · escreva ao menos 30 palavras para registrar")};
  upd();
  ta.addEventListener("input",()=>{st.notes[n]=ta.value;save();upd()});
}

function agendaPage(){
  const has=!!st.plan;
  const pl=planOf();
  const opts=[1,2,3,4].map(m=>{const a=buildAgenda(planOf(m));const lv=level(a.h0);return {m,a,lv}});
  const ag=buildAgenda(pl);
  const todayIso=isoD(new Date());
  const optsHTML=`<div class="opts">${opts.map(o=>`<button type="button" class="opt" data-m="${o.m}" aria-pressed="${has&&pl.months===o.m}"><b>${o.m} ${o.m===1?"mês":"meses"}</b><span class="n">${o.a.empty?"sem dias de estudo":"≈ "+pad(o.a.h0.toFixed(1))+" h por dia útil · "+pad((o.a.h0*2).toFixed(1))+" h no sábado"}</span><span class="tag2 ${o.lv[1]}">${o.lv[0]}${o.m===3?" · recomendado":""}</span></button>`).join("")}</div>`;
  let body="";
  if(has){
    const wk={};
    ag.days.forEach(d=>{const mon=addDays(d.date,-((d.date.getDay()+6)%7));const k=isoD(mon);(wk[k]=wk[k]||[]).push(d)});
    const dayHTML=d=>{
      const bl=blocksFor(d,pl);const isT=isoD(d.date)===todayIso;const hot=d.w===1&&d.hours>3;
      const desc=dayDesc(d);
      return `<div class="dayc ${isT?"is-today":""}"><div class="dh"><b>${isT?"Hoje, ":""}${dayName(d.date)}</b><span class="${hot?"hot":""}">${bl.map(b=>fmtT(b[0])+"–"+fmtT(b[1])).join(" e ")} · ${hh(d.hours)}${hot?" · difícil de caber à noite":""}</span></div>
      ${d.entries.map(e=>{const x=e.t;const ext=x.u&&!x.u.startsWith("#");const link=ext?`<a href="${x.u}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>`:`<a href="#aula-${x.n}">Aula ${x.n} →</a>`;
        const box=x.resumo?`<input type="checkbox" disabled ${x.done?"checked":""} aria-label="Resumo">`:`<input type="checkbox" data-id="${x.id}" ${x.done?"checked":""} ${e.toNext?"disabled":""} aria-label="Concluir: ${esc(x.t)}">`;
        return `<div class="tk ${x.done?"dn":""}">${box}<div class="tn">${x.t}<small>Aula ${x.n} · ${KL[x.k]||x.k} · ${hh(e.part)}${e.fromPrev?" · continuação":""}${e.toNext?" · continua no próximo dia":""}</small></div>${link}</div>`}).join("")}
      <p style="margin:.6rem 0 0">${bl.map((b,i)=>`<a class="gc" href="${gcal(d,b,desc)}" target="_blank" rel="noopener noreferrer">Adicionar ${bl.length>1?"bloco "+(i+1):"este bloco"} ao Google Agenda ↗</a>`).join("")}</p></div>`};
    const todayDay=ag.days.find(d=>isoD(d.date)===todayIso);
    const weeks=Object.keys(wk).sort();
    body=`
    <div class="today"><h2>${todayDay&&todayDay.hours>0?"Hoje":"Hoje: descanso"}</h2>
      ${todayDay&&todayDay.hours>0?dayHTML(todayDay):`<p class="hint">${ag.empty?"O prazo do plano terminou. Escolha um novo prazo acima.":"Hoje não é dia de estudo no seu plano. Próximo bloco: "+(ag.days.find(d=>d.hours>0)?dayName(ag.days.find(d=>d.hours>0).date):"nenhum")+"."}</p>`}</div>
    <div class="agm"><div class="stats">
      <div><label>Faltam</label><b>${pad(ag.Hrem.toFixed(1))} h</b></div>
      <div><label>Término</label><b>${fmtD(ag.end)}</b></div>
      <div><label>Dias de estudo</label><b>${ag.days.length}</b></div>
      <div><label>Sequência</label><b>${streak()} ${streak()===1?"dia":"dias"}</b></div></div>
      <p>${ag.h0>0?`O plano reparte as horas que faltam entre os dias que restam. Se você atrasar, a cota dos próximos dias sobe sozinha; se adiantar, ela cai. ${level(ag.h0)[1]==="warn"?"<span class=\"late\">A cota está puxada para quem trabalha até as 17h. Considere estender o prazo.</span>":"<span class=\"ok\">Cota compatível com quem trabalha das 7h às 17h.</span>"}`:""}</p>
      <p>Inclui 15 minutos por aula para escrever o resumo (2h30 no total).</p>
      <p><a class="go" href="#" id="csvb" style="display:inline-block">Baixar agenda para o Google Agenda (CSV)</a> <span id="csvmsg" class="hint"></span></p>
    </div>
    <h2 class="sub">Agenda completa</h2>
    ${weeks.map((k,i)=>{const arr=wk[k];const a=arr[0].date,b=arr[arr.length-1].date;const h=arr.reduce((x,d)=>x+d.hours,0);return `<details class="wk" ${i<2?"open":""}><summary>Semana de ${p2(a.getDate())}/${p2(a.getMonth()+1)} a ${p2(b.getDate())}/${p2(b.getMonth()+1)} · ${hh(h)}</summary>${arr.map(dayHTML).join("")}</details>`}).join("")}`;
  }
  const dsel=`<div class="dsel" role="group" aria-label="Dias de estudo">${[1,2,3,4,5,6,0].map(g=>`<button type="button" data-d="${g}" aria-pressed="${pl.days.includes(g)}">${DOWS[g]}</button>`).join("")}</div>`;
  app.innerHTML=`<section class="hero gut" style="padding-block:2rem 2.2rem"><div class="in" style="grid-template-columns:1fr"><div>
    <a class="back" href="#">← todas as aulas</a>
    <h1 style="font-size:clamp(1.9rem,5vw,3rem)">Sua agenda do curso</h1>
    <p>Rotina é o que termina curso. Escolha o prazo e o curso monta a agenda diária das 100 horas, com os horários depois do seu expediente de 7h às 17h nos dias úteis e blocos maiores no fim de semana.</p></div></div></section>
  <main class="gut body"><div class="in">
    <h2 class="sub" style="margin-top:0">1. Em quantos meses você quer concluir?</h2>${optsHTML}
    <div class="agm"><h2 style="font:700 1.05rem var(--f-display);margin:0">2. Seus dias e horários</h2>
      <p>Marque os dias em que você estuda. Por padrão a sexta fica livre para descanso.</p>
      <div class="setg"><div style="grid-column:1/-1"><label>Dias de estudo</label>${dsel}</div>
        <div><label for="pstart">Início do plano</label><input type="date" id="pstart" value="${pl.start}"></div>
        <div><label for="ptw">Dias úteis: início (após o trabalho)</label><input type="time" id="ptw" value="${pl.tw}"></div>
        <div><label for="ptsat">Sábado: início</label><input type="time" id="ptsat" value="${pl.tsat}"></div>
        <div><label for="ptsun">Domingo: início</label><input type="time" id="ptsun" value="${pl.tsun}"></div></div>
      ${has?`<p style="margin-top:1rem"><a href="#" id="resetp" class="hint">Remover o plano</a></p>`:`<p class="hint" style="margin-top:1rem">Escolha um prazo acima para gerar a agenda.</p>`}</div>
    ${body}</div></main>`;
  const keep=()=>{const y=window.scrollY;agendaPage();window.scrollTo(0,y)};
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{st.plan=Object.assign({},planOf(),{months:Number(b.dataset.m)});if(!st.plan.start)st.plan.start=isoD(new Date());save();keep();top_()}));
  app.querySelectorAll(".dsel button").forEach(b=>b.addEventListener("click",()=>{const g=Number(b.dataset.d);const cur=planOf();let d=cur.days.includes(g)?cur.days.filter(x=>x!==g):cur.days.concat([g]);if(!d.length)return;st.plan=Object.assign({},cur,{days:d});save();keep()}));
  [["pstart","start"],["ptw","tw"],["ptsat","tsat"],["ptsun","tsun"]].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.addEventListener("change",()=>{if(!el.value)return;st.plan=Object.assign({},planOf(),{[k]:el.value});save();keep()})});
  app.querySelectorAll(".tk input[data-id]").forEach(cb=>cb.addEventListener("change",e=>{setDone(e.target.dataset.id,e.target.checked);keep();top_()}));
  const rp=document.getElementById("resetp");if(rp)rp.addEventListener("click",e=>{e.preventDefault();st.plan=null;save();keep()});
  const cb=document.getElementById("csvb");if(cb)cb.addEventListener("click",e=>{e.preventDefault();exportCsv(ag,pl)});
}

function top_(){document.getElementById("topst").textContent=pad(allDoneH())+" / "+TOTAL+" h"}
function route(){
  const h=location.hash;let m;
  if((m=/^#aula-(\d+)$/.exec(h)))lesson(Number(m[1]));
  else if((m=/^#texto-(\d+)$/.exec(h)))textoPage(Number(m[1]));
  else if((m=/^#ficha-([a-z0-9-]+)$/.exec(h)))fichaPage(m[1]);
  else if(h==="#agenda")agendaPage();
  else home();
  top_();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
