}
@media (prefers-color-scheme: dark){

    --link:#7DBCF5; --ok:#4ADE80; --warn:#F5B454; --hero:#0D2A47; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121D; --surface:#0F2033; --fg:#E8EEF4; --muted:#8FA3B5; --line:#203449; --chip:#17304A;
  --link:#7DBCF5; --ok:#4ADE80; --warn:#F5B454; --hero:#0D2A47; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);padding-block:0 4rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:30}
a{color:var(--link)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:920px;margin:0 auto}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--hero-fg)}
.bar .in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.7rem}
.brand{display:flex;align-items:center;gap:.7rem;color:inherit;text-decoration:none;font:700 1rem var(--f-display)}

.bar .st{font:500 .78rem var(--f-mono);color:var(--hero-muted);white-space:nowrap}

.hero{background:var(--hero);color:var(--hero-fg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;padding-block:2.5rem 3rem}
.hero .in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:center}
.eyebrow{font:500 .75rem/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted)}
.hero h1{font:800 clamp(2.1rem,6vw,3.6rem)/1.02 var(--f-display);margin:.7rem 0 1rem;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--hero-muted);max-width:52ch}
.cta{display:inline-block;margin-top:1.4rem;background:var(--accent);color:var(--on-accent);font:700 1rem var(--f-body);text-decoration:none;padding:.8rem 1.3rem;border-radius:4px}
.cta:hover{filter:brightness(1.06)}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.14)} .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .4s}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:800 2rem/1 var(--f-display)} .ring .c span{font:500 .72rem var(--f-mono);color:var(--hero-muted)}

.plan{margin-top:-1.6rem;position:relative}
.plan .box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;align-items:end}
.plan label{display:block;font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.plan input{width:100%;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.5rem .6rem}
.plan .big{font:700 1.15rem var(--f-display)}
.plan .msg{grid-column:1/-1;margin:0;font-size:.92rem;color:var(--muted)}
.plan .msg.ok{color:var(--ok)} .plan .msg.late{color:var(--warn)}

h2.sec{font:700 1.5rem var(--f-display);margin:2.5rem 0 1rem;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.card{position:relative;display:flex;flex-direction:column;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.2rem 1.2rem;text-decoration:none;color:var(--fg);overflow:hidden;min-height:190px}
.card:hover{border-color:var(--fg)}
.card .num{font:800 4.2rem/.9 var(--f-display);color:transparent;-webkit-text-stroke:1.5px var(--line);margin-bottom:.2rem}
.card:hover .num{-webkit-text-stroke-color:var(--accent)}
.card h3{font:700 1.08rem/1.25 var(--f-display);margin:0;text-wrap:balance}
.card .m{margin-top:auto;display:flex;justify-content:space-between;gap:.5rem;font:500 .74rem var(--f-mono);color:var(--muted)}
.card .pb{height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:.5rem}
.card .pb i{display:block;height:100%;background:var(--ok)}
.card.done .num{-webkit-text-stroke-color:var(--ok)}
.rs{font:600 .7rem var(--f-mono);color:var(--ok)}

.lh{background:var(--hero);color:var(--hero-fg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;padding-block:1.6rem 2.4rem}
.back{color:var(--hero-muted);font:500 .8rem var(--f-mono);text-decoration:none}
.back:hover{color:var(--hero-fg)}
.lh h1{font:800 clamp(1.8rem,5vw,3rem)/1.05 var(--f-display);margin:1rem 0 .6rem;letter-spacing:-.02em;text-wrap:balance}
.lh .n{font:800 clamp(4rem,12vw,7rem)/.85 var(--f-display);color:transparent;-webkit-text-stroke:2px var(--accent);display:block}
.lh p{margin:0;color:var(--hero-muted);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem}
.chip{font:500 .74rem var(--f-mono);background:rgba(255,255,255,.1);color:var(--hero-fg);border-radius:3px;padding:.25rem .55rem}
.body{padding-top:2rem}
.aula{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.4rem 1.5rem}
.aula h2{font:700 1.25rem var(--f-display);margin:0 0 .7rem}
.aula p{max-width:68ch;margin:.7rem 0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.8rem}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.3rem 1rem;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem 1.1rem}
.step .c{width:1.4rem;height:1.4rem;accent-color:var(--ok);margin:.15rem 0 0}
.step.done{opacity:.72}
.step.done .tt{text-decoration:line-through}
.kind{display:inline-block;font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--chip);border-radius:3px;padding:.12rem .45rem;margin-right:.4rem}
.kind.v{background:var(--accent);color:var(--on-accent)}
.pick{font:600 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.pick.alt{color:var(--muted)}
.tt{font:600 1.02rem/1.35 var(--f-body);margin:.35rem 0 .2rem;overflow-wrap:anywhere}
.why{font-size:.9rem;color:var(--muted);margin:.1rem 0}
.mt{font:400 .75rem var(--f-mono);color:var(--muted);margin-top:.35rem;display:flex;flex-wrap:wrap;gap:.3rem .9rem}
.go{align-self:center;font:700 .88rem var(--f-body);text-decoration:none;background:var(--accent);color:var(--on-accent);padding:.6rem .95rem;border-radius:4px;white-space:nowrap}
.go.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.go.alt:hover{border-color:var(--fg)}
.go:hover{filter:brightness(1.06)}
.sub{margin:2rem 0 .3rem;font:700 1.3rem var(--f-display)}
.subp{margin:0 0 .9rem;color:var(--muted);font-size:.92rem}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:1rem}
.blk>summary{cursor:pointer;padding:1rem 1.2rem;font:700 1.05rem var(--f-display)}
.blk>div{padding:0 1.2rem 1.2rem}
.blk ol{margin:0;padding-left:1.2rem} .blk li{margin:.4rem 0}
.resumo{background:var(--surface);border:2px solid var(--accent);border-radius:6px;padding:1.2rem 1.3rem;margin-top:1.6rem}
.resumo h2{font:700 1.25rem var(--f-display);margin:0 0 .3rem}
.resumo textarea{width:100%;min-height:11rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.8rem;resize:vertical;margin-top:.6rem;line-height:1.6}
.resumo .cnt{font:500 .75rem var(--f-mono);color:var(--muted);margin-top:.4rem}
.hint{font-size:.85rem;color:var(--muted)}
.act{display:flex;flex-direction:column;gap:.45rem;align-self:center}
.go.pdfb{background:transparent;color:var(--fg);border:2px solid var(--accent)}
.go.pdfb:hover{background:var(--accent);color:var(--on-accent)}
.dg{padding:1rem 0;border-top:1px solid var(--line)}
.dg:first-of-type{border-top:0}
.dg h3{font:700 1.05rem var(--f-display);margin:0}
.dg .x{margin:.3rem 0 .6rem;color:var(--muted);font-size:.93rem}
.dga{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;margin-bottom:.7rem}
.dga label{display:flex;gap:.5rem;align-items:center;font-size:.9rem}
.dga input{width:1.2rem;height:1.2rem;accent-color:var(--ok)}
.fich{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.fich a{display:block;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.8rem 1rem;font-weight:600;font-size:.94rem}
.fich a small{display:block;font:500 .7rem var(--f-mono);color:var(--muted);margin-top:.2rem;text-transform:uppercase;letter-spacing:.08em}
.fich a:hover{border-color:var(--accent)}
.apost{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;background:var(--surface);border:2px solid var(--accent);border-radius:6px;padding:1rem 1.2rem;margin-bottom:1rem}
.apost b{font:700 1.05rem var(--f-display)}
.apost span{display:block;font-size:.88rem;color:var(--muted)}
.pdfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.pdfs a{display:block;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:.8rem 1rem;font-weight:600;font-size:.94rem}
.pdfs a small{display:block;font:500 .7rem var(--f-mono);color:var(--muted);margin-top:.2rem;text-transform:uppercase;letter-spacing:.08em}
.pdfs a:hover{border-color:var(--fg)}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.pn a{flex:1 1 220px;display:block;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.9rem 1.1rem}
.pn a:hover{border-color:var(--fg)}
.pn small{display:block;font:500 .72rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pn a.r{text-align:right}

.diag{display:grid;gap:.6rem;margin-top:.8rem}
.dr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4rem 1rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.dr:first-child{border-top:0}
.sc{display:flex;gap:.3rem}
.sc button{width:2.2rem;height:2.2rem;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font:600 .9rem var(--f-mono)}
.sc button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.res{margin-top:1rem;padding:1rem 1.1rem;background:var(--bg);border-radius:6px;border:1px dashed var(--line)}
.res b{font-family:var(--f-display)}

.foot{margin-top:3rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:1rem}
.foot b{color:var(--fg)}
@media (max-width:620px){
  .hero .in{grid-template-columns:1fr}
  .ring{width:120px;height:120px}
  .step{grid-template-columns:auto minmax(0,1fr)}
  .step .act{grid-column:2;flex-direction:row;flex-wrap:wrap;margin-top:.5rem}
  .dr{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style>

const v=(t,id,h,why,src)=>({k:"vídeo",t,why:why||"",h,u:yt(id),pick:h?"P":"A",src:src||"YouTube"});
/* leitura: r(tipo, título, url, horas, porquê, fonte) */
const r=(k,t,u,h,why,src)=>({k,t,why:why||"",h,u,pick:h?"P":"A",src:src||""});
const AUTO={k:"autoavaliação",t:"Diagnóstico: avalie as 9 competências do curso",why:"Clique nas notas. O resultado indica em quais aulas gastar mais tempo.",h:1,u:null,pick:"",src:""};

/* ========= conteúdo ========= */
const DIAG=[
 {k:"d1",t:"Contrato de obra no direito privado",a:2,vt:"Entenda o contrato por empreitada global",vid:"T1P9wyCGcHc",f:"empreitada-regimes",x:"Saber quem carrega o risco de quantidade e de custo em cada tipo de empreitada e o que o Código Civil diz sobre a obra."},
 {k:"d2",t:"Lei 14.133, reequilíbrio e TCU",a:3,vt:"Reajuste, Repactuação e Reequilíbrio: Recupere o que é seu",vid:"MiRzGI8Hqbw",f:"reajuste-repactuacao-reequilibrio",x:"Distinguir reajuste, repactuação e reequilíbrio e saber em que prazo e com que documentos pedir cada um em obra pública."},
 {k:"d3",t:"Notificação, registro e estrutura de pleito",a:4,vt:"A incidência da preclusão lógica na revisão contratual",vid:"WjDxn9cdcx0",f:"pleito-estrutura",x:"Notificar no prazo, registrar o que acontece e montar um pleito que prova a ligação entre o evento e o efeito."},
 {k:"d4",t:"Cronograma e CPM",a:5,vt:"Folga do projeto, folga total e folga livre",vid:"l1ZdqVlwazo",f:"cpm-folgas",x:"Ler um cronograma: caminho crítico, folga total e folga livre."},
 {k:"d5",t:"Análise de atraso e métodos da AACE 29R-03",a:6,vt:"Forensic Delay Analysis for Beginners",vid:"dpx-7LF1vvo",f:"delay-visao-geral",x:"Escolher e justificar um método de análise de atraso entre os nove da AACE 29R-03."},
 {k:"d6",t:"Atraso concorrente e TIA",a:7,vt:"Time Impact Analysis Delay Analysis",vid:"1eq5au6l_CI",f:"tia",x:"Medir o efeito de um evento no término (TIA) e tratar atraso causado por duas partes ao mesmo tempo."},
 {k:"d7",t:"BDI, custo de atraso e perda de produtividade",a:8,vt:"BDI de Obras: Como Calcular Segundo o TCU (Passo a Passo)",vid:"4KiXqW4KfhM",f:"bdi-tcu",x:"Formar o valor do pleito: BDI, custo de atraso e perda de produtividade."},
 {k:"d8",t:"Valor agregado (EVM)",a:8,vt:"Aula de Gestão do Valor Agregado (VA, VP, IDC, IDP, CR)",vid:"-RyQ-Zoaocc",f:"evm",x:"Usar valor planejado, agregado e custo real, e os índices de prazo e custo, para dar sinal precoce de desvio."},
 {k:"d9",t:"Dispute Boards e resolução de disputas",a:9,vt:"Os Dispute Boards",vid:"gVjrZ_EU-74",f:"dispute-boards",x:"Entender os comitês de disputas, seus modelos e como a lei brasileira os trata."}
];
const dstep=d=>({k:"vídeo",t:d.vt,why:"Competência: "+d.t+".",h:1,u:yt(d.vid),pick:"P",src:"YouTube",d:d.k,f:d.f});
const LESSONS=[
{n:1,t:"Orientação e diagnóstico",goal:"Entender o que você está construindo, medir de onde parte e ver como é o trabalho de quem administra contratos de obra.",
 intro:[
 "Alexis, o objetivo desta pós não é acumular horas de vídeo. É sair capaz de fazer quatro coisas com um contrato de obra na mão: ler onde está o risco, registrar o que acontece, provar quanto prazo e quanto dinheiro cada evento custou e levar isso a uma negociação ou a um comitê de disputas.",
 "A tese que organiza tudo: pleito é prova, não argumento. A maioria dos pleitos de obra perde porque a notificação saiu fora do prazo, o diário de obra não registrou o evento e o cronograma não permite medir o atraso, não porque o direito é fraco. Por isso o curso começa no contrato, passa por cronograma e custo e só então chega ao Dispute Board.",
 "O perfil que você está formando é o de administrador contratual e analista de pleitos de obra: gerente de contratos de construtora, consultor de claims, assessor de comitê de disputas e, mais adiante, candidato a membro de comitê.",
 "O diagnóstico abaixo tem nove competências. Cada uma traz uma explicação, um vídeo curto e uma ficha em PDF da técnica. Assista, leia a ficha e só então dê a sua nota: assim a nota mede o que você sabe depois de ver o básico, e o resultado aponta onde reforçar.",
 "Como estudar cada aula: leia a explicação, assista aos vídeos principais na ordem, abra as leituras indicadas e, no fim, escreva o seu resumo do que aprendeu. O resumo é o único texto que você escreve. Ele serve para fixar e vira o seu material de revisão.",
 "Limites. O curso é técnico e de gestão, não parecer jurídico. Prazos, efeitos de decisões e jurisprudência devem ser confirmados com advogado e na fonte oficial antes de uso em um caso real."],

 v("Gestão de Contratos de Construção Civil: estratégias para maximizar eficiência","JKwNeNtJHtk",1,"Webinar com um gerente de planejamento de incorporadora; mostra a rotina de mercado.","YouTube · webinar"),
 ...DIAG.map(dstep),
 v("Alternativa: Construction Contract Administration, guia passo a passo","qzKTvbGs3j0",0,"Para ouvir o vocabulário internacional do tema."),
 v("Alternativa: Construction Contract Management Explained in 8 Minutes","rTzdJm9-QoE",0,"Resumo curto, em inglês.")
 ],
 q:["Qual obra e qual tipo de evento (atraso, aditivo, perda de produtividade) serão seu caso de referência ao longo do curso?","O que você quer ser capaz de fazer em 10 semanas que hoje não faz?"],
 sum:"Escreva: (1) o que faz um administrador contratual de obra; (2) por que pleito é prova e não argumento; (3) quais as 3 competências em que você mais precisa evoluir, segundo o diagnóstico, e o que cada uma das nove significa em uma frase."},

{n:2,t:"Fundamentos da administração contratual de obras",goal:"Empreitada, tipos de preço, risco e controle de mudanças: a base sem a qual o resto vira técnica sem contrato.",
 intro:[
 "Na obra privada, o contrato manda e o Código Civil preenche as lacunas. A empreitada está nos arts. 610 a 626. O art. 618 impõe ao empreiteiro responsabilidade pela solidez e segurança da obra por cinco anos, prazo que as partes não reduzem por contrato.",
 "O tipo de preço define quem carrega qual risco. No preço global, o contratado assume o risco de quantidade: se o projeto não mudou e ele errou o quantitativo, paga. No preço unitário, o contratante paga o que foi medido e carrega o risco de variação de quantidade. Na administração, o contratante reembolsa custos mais uma taxa. No EPC ou turn-key, o contratado assume projeto, suprimento e construção, e com isso o risco das interfaces.",
 "A matriz de risco diz, para cada evento, quem paga e quem ganha prazo. Todo pleito nasce na fronteira entre um risco do contratante e um do contratado. Se a matriz é vaga, a disputa é certa.",
 "Gestão de mudanças é o hábito que evita o pleito: toda alteração de escopo, prazo ou preço precisa de ordem formal, assinada por quem tem poder, antes ou logo depois de acontecer."],

{n:3,t:"Contratos públicos de obras: Lei 14.133 e TCU",goal:"Alteração contratual, reequilíbrio, reajuste e repactuação em obra pública.",
 intro:[
 "Em obra pública, o contrato é administrativo: a Administração pode alterar unilateralmente dentro de limites, e o contratado tem direito à manutenção do equilíbrio econômico-financeiro. A Lei 14.133/2021 trata das alterações nos arts. 124 a 136. O art. 125 fixa os limites de acréscimos e supressões (25%, e 50% para reforma de edifício ou equipamento).",
 "Três ferramentas, três usos. Reajuste aplica o índice previsto no contrato, em geral a cada 12 meses. Repactuação é própria de serviços contínuos com mão de obra. Reequilíbrio recompõe o equilíbrio inicial quando um fato extraordinário ou uma alteração o rompe; o art. 124, II, d, é a base citada para força maior, caso fortuito e fato do príncipe. Segundo orientação do TCU, o pedido deve ser feito durante a vigência do contrato e antes de eventual prorrogação.",
 "O erro típico do contratado em obra pública é tratar o pedido de reequilíbrio como carta comercial. Ele precisa de fato, nexo, planilha e documentos de suporte. Um dos vídeos da aula lista os documentos que acompanham o pedido."],

{n:4,t:"Pleito, notificação e registro contemporâneo",goal:"A aula que decide pleito: notificar no prazo, registrar o que aconteceu e provar o nexo.",
 intro:[
 "Um pleito completo responde a quatro perguntas: o que aconteceu (evento), de quem é o risco (contrato), que efeito teve no prazo e no custo (nexo causal e quantificação) e o que se pede (prazo, valor ou ambos). Prazo e dinheiro são pedidos separados e se provam separados.",
 "Notificação: quase todo contrato fixa um prazo para avisar a outra parte do evento. Perder esse prazo pode custar o direito, dependendo da cláusula e do que a lei permite. O vídeo sobre preclusão lógica na revisão contratual, visto na aula 1, trata de tema ligado a esse risco.",
 "Prova contemporânea é a que nasce no momento do fato: diário de obra, atas, e-mails, fotos datadas, cartas com protocolo, medições, atualizações de cronograma. Reconstruir depois é mais caro e mais fácil de contestar.",
 "Os vídeos em português específicos sobre pleito de obra foram escassos. Os melhores achados sobre claims estão em inglês e servem para fixar vocabulário, tipos de pedido e causas."],

{n:5,t:"Cronograma e CPM: a base comum",goal:"Qualidade do cronograma, lógica, caminho crítico e folga. Análise de atraso sobre cronograma ruim produz número ruim.",
 intro:[
 "O caminho crítico é a sequência de atividades que define a data final. Atrasar uma atividade crítica atrasa a obra. Folga total é quanto uma atividade pode atrasar sem atrasar o término; folga livre é quanto pode atrasar sem atrasar a sucessora.",
 "Antes de qualquer análise, audite o cronograma: lógica aberta (atividades sem predecessora ou sucessora), restrições de data que forçam o caminho crítico, folga negativa, calendários inconsistentes e relações em excesso. Cada defeito dá ao outro lado um argumento contra a sua análise. A avaliação em 14 pontos da DCMA e o guia de avaliação de cronograma do GAO são referências usadas para isso.",
 "A AACE publica práticas recomendadas de cronograma: lógica das atividades (RP 24R-03), identificação do caminho crítico (49R-06), documentação da base do cronograma (38R-06) e níveis de detalhe (37R-06). O PMI complementa com o Practice Standard for Scheduling."],

{n:6,t:"Análise de atraso: AACE RP 29R-03",goal:"Os nove métodos, como escolher entre eles e como são aplicados. Núcleo técnico do curso.",
 intro:[
 "A RP 29R-03 descreve nove métodos de análise forense de cronograma, os MIPs 3.1 a 3.9, e os fatores para escolher entre eles. A norma não manda usar um método; exige que a escolha seja justificada. Foi publicada em 2007 e revisada em 2009 e 2011, e há rascunho de atualização em discussão: confirme a versão vigente no site da AACE. O texto completo é para membros ou compra; os links desta aula levam ao sumário e às apresentações dos autores na plataforma da própria AACE.",
 "Os nove métodos: 3.1 observacional, estático, bruto (planejado contra realizado); 3.2 observacional, estático, periódico; 3.3 observacional, dinâmico, contemporâneo como está; 3.4 observacional, dinâmico, contemporâneo dividido; 3.5 observacional, dinâmico, modificado ou recriado; 3.6 modelado, aditivo, base única; 3.7 modelado, aditivo, bases múltiplas; 3.8 modelado, subtrativo, simulação única; 3.9 modelado, subtrativo, bases múltiplas.",
 "Como ler a classificação: observacional compara cronogramas sem inserir ou retirar atrasos; modelado simula. Estático usa duas fotografias; dinâmico usa a sequência de atualizações. Aditivo insere os atrasos num cronograma; subtrativo os retira do cronograma real (o clássico collapsed as-built).",
 "Posição prática: se o projeto tem atualizações mensais confiáveis, o método por janelas (observacional dinâmico, MIP 3.3) costuma ser o mais defensável. Se não tem, a escolha passa a ser um problema de dados. A crítica comum aos métodos modelados é a dependência de premissas do analista."],

{n:7,t:"TIA prospectivo e atraso concorrente",goal:"Impacto de tempo prospectivo e o confronto entre a AACE e o protocolo SCL.",
 intro:[
 "O TIA (Time Impact Analysis) insere um evento no cronograma vigente para medir o efeito no término. A RP 52R-06 trata da versão prospectiva, feita durante a obra, para pedir prorrogação antes de o atraso se consumar. A própria norma avisa que quanto maior o intervalo entre o evento e a aprovação do TIA, menos útil e válida ele é.",
 "Atraso concorrente é quando duas ou mais causas, de partes diferentes, atrasam o término no mesmo período. O tratamento varia por contrato, por jurisdição e por protocolo. O protocolo da Society of Construction Law (2ª edição, 2017) e a AACE divergem em alguns pontos; estudar a divergência é mais útil que escolher um lado.",
 "No Brasil, a regra prática é ler o seu contrato: ele diz de quem é a folga, se há prorrogação sem custo para atraso concorrente e como se prova. O protocolo SCL não tem força de lei, a menos que o contrato o adote."],

{n:8,t:"Quantum: BDI, produtividade e valor agregado",goal:"Transformar atraso e mudança em valor defensável.",
 intro:[
 "Quantum é o valor do pleito. Separe três componentes: custo direto da mudança, custo de atraso (manter a obra ativa por mais tempo: administração local, canteiro, equipamentos) e perda de produtividade (mesmo trabalho exigindo mais horas por interferência).",
 "BDI: ao precificar aditivos, use o BDI do contrato e confronte com a faixa do Acórdão 2622/2013 do TCU quando o objeto for obra pública. O acórdão fixou faixas de referência por tipo de obra. Um vídeo da busca cita o Acórdão 2340/2024 sobre BDI diferenciado de equipamentos: confira se ele alterou algo do 2622.",
 "Perda de produtividade é a parte mais difícil de provar. O método do Measured Mile compara a produtividade num trecho afetado com a de um trecho comparável sem interferência. A RP 25R-03 da AACE trata da estimativa de perda de produtividade em claims; segundo um artigo da FTI, ela aponta o Measured Mile e a análise de valor agregado como métodos preferidos. A RP é de 2004 e há relato não confirmado de atualização: confira no site da AACE.",
 "Valor agregado (EVM) compara previsto (PV), realizado em valor (EV) e custo real (AC). SPI é EV dividido por PV e mede prazo; CPI é EV dividido por AC e mede custo. É ferramenta de controle e dá sinal precoce de desvio; não prova nexo causal sozinho."],
 steps:[
 r("artigo","Assessing Loss of Productivity in Construction: The Importance of Contemporaneous Documentation","https://www.fticonsulting.com/insights/articles/assessing-loss-productivity-construction-contemporaneous-documentation",1,"Artigo que discute os métodos da RP 25R-03 e a documentação necessária.","FTI Consulting"),
 r("pdf","Productivity Claims (artigo para advogados de construção)","https://www.agc.org/sites/default/files/users/user22628/CLE%20Paper_%20Productivity%20Claims%20.pdf",1,"Texto da AGC sobre claims de produtividade.","AGC"),

function plan(){
  const start=new Date(st.start+"T00:00:00");
  const hpw=Math.max(1,Number(st.hpw)||10);
  const days=Math.floor((Date.now()-start.getTime())/86400000);
  const expected=Math.max(0,Math.min(TOTAL,days/7*hpw));
  const end=new Date(start.getTime()+Math.ceil(TOTAL/hpw)*7*86400000);
  return {start,hpw,expected,end};
}

  const pk=s.pick==="P"?`<span class="pick">Principal</span>`:s.pick==="A"?`<span class="pick alt">Alternativa</span>`:"";
  return `<li class="step ${st.done[s.id]?"done":""}">
    <input class="c" type="checkbox" id="${s.id}" ${st.done[s.id]?"checked":""} aria-label="Marcar como feito: ${esc(s.t)}">
    <div><div><span class="kind ${k}">${KL[s.k]||s.k}</span>${pk}</div>
      <div class="tt">${s.t}</div>
      ${s.why?`<p class="why">${s.why}</p>`:""}
      <div class="mt"><span>${s.h?s.h+" h (estimativa)":"opcional, fora das 100 h"}</span>${s.src?`<span>${s.src}</span>`:""}${s.f?`<span>Ficha: ${FT[s.f]||s.f}</span>`:""}</div>
    </div><div class="act">${main}${pdf}</div></li>`;
}

function diagHTML(L){
  const rated=DIAG.filter(d=>st.diag[d.k]);
  let res=`<p class="hint">Para cada competência: assista ao vídeo, leia a ficha em PDF e dê a sua nota de 1 (nunca vi) a 5 (faço sozinho). O resultado aparece quando as nove tiverem nota.</p>`;
  if(rated.length===DIAG.length){
    const sorted=[...DIAG].sort((a,b)=>st.diag[a.k]-st.diag[b.k]);
    const low=sorted.slice(0,3);
    const avg=(DIAG.reduce((a,d)=>a+st.diag[d.k],0)/DIAG.length).toFixed(1).replace(".",",");
    res=`<div class="res"><b>Média: ${avg} de 5.</b> Reforce primeiro: ${low.map(d=>`<a href="#aula-${d.a}">aula ${d.a}</a> (${d.t.toLowerCase()}, nota ${st.diag[d.k]})`).join("; ")}. Reserve mais tempo nelas e passe rápido pelas de nota 4 ou 5. Se a análise de atraso (aula 6) ficou abaixo de 3, não corte nada dela: é o núcleo do curso.</div>`;
  }
  return `<div class="aula" style="margin-top:1rem"><h2>Diagnóstico das 9 competências</h2>
  ${DIAG.map((d,i)=>{const s=L.steps.find(x=>x.d===d.k);return `<div class="dg">
    <h3>${i+1}. ${d.t}</h3><p class="x">${d.x}</p>
    <div class="dga"><label><input class="c" type="checkbox" id="${s.id}" ${st.done[s.id]?"checked":""}> Assisti (1 h)</label>
      <a class="go" href="${s.u}" target="_blank" rel="noopener noreferrer">Assistir: ${s.t} ↗</a>
      <a class="go pdfb" href="fichas/${d.f}.pdf" target="_blank" rel="noopener noreferrer">PDF da técnica ↗</a></div>
    <div class="sc" role="group" aria-label="Nota para ${esc(d.t)}">${[1,2,3,4,5].map(n=>`<button type="button" data-k="${d.k}" data-v="${n}" aria-pressed="${st.diag[d.k]===n}">${n}</button>`).join("")}</div>
  </div>`}).join("")}${res}</div>`;
}

function lesson(n){
  const L=LESSONS.find(x=>x.n===n);if(!L){home();return}
  const prev=LESSONS.find(x=>x.n===n-1),nx=LESSONS.find(x=>x.n===n+1);
  const nv=L.steps.filter(s=>s.k==="vídeo"&&s.h).length;
  const nr=L.steps.filter(s=>["pdf","livro","norma","artigo"].includes(s.k)&&s.h).length;
  app.innerHTML=`
  <section class="lh gut"><div class="in">
    <a class="back" href="#">← todas as aulas</a>
    <h1><span class="n">${L.n}</span>${L.t}</h1>
    <p>${L.goal}</p>
    <div class="chips"><span class="chip">${L.h} h</span><span class="chip">${nv} vídeo${nv===1?"":"s"}</span><span class="chip">${nr} leitura${nr===1?"":"s"}</span><span class="chip">${pad(doneH(L))} h feitas</span></div>
    <p style="margin-top:1.1rem"><a class="go" href="apostilas/aula-${L.n}.pdf" target="_blank" rel="noopener noreferrer">PDF técnico da aula ↗</a></p>
  </div></section>
  <main class="gut body"><div class="in">
    <div class="apost"><div><b>PDF técnico da aula ${L.n}</b><span>Apostila que explica a aula: texto, todas as técnicas, roteiro com links e perguntas.</span></div><a class="go" href="apostilas/aula-${L.n}.pdf" target="_blank" rel="noopener noreferrer">Abrir PDF técnico ↗</a></div>
    <div class="aula"><h2>A aula</h2>${L.intro.map(p=>`<p>${p}</p>`).join("")}</div>
    ${n===1?diagHTML(L):""}
    <h2 class="sub">Roteiro de estudo</h2>
    <p class="subp">Faça na ordem. Marque cada item ao terminar. Os itens "Alternativa" são opcionais.</p>
    ${SEEN[n]?`<p class="subp">Já visto na aula 1, por isso não repetido aqui: ${SEEN[n]}.</p>`:""}
    <ol class="steps">${L.steps.filter(x=>!x.d).map(stepHTML).join("")}</ol>
    <h2 class="sub">Fichas em PDF desta aula</h2>
    <p class="subp">Cada ficha explica uma técnica da aula em uma página. Foram escritas para este curso; confirme na fonte antes de citar.</p>
    <div class="fich">${fichasOf(L).map(f=>`<a href="fichas/${f}.pdf" target="_blank" rel="noopener noreferrer">${FT[f]||f}<small>PDF · 1 página</small></a>`).join("")}</div>
    <details class="blk"><summary>Para pensar: ${L.q.length} perguntas (sem escrever)</summary><div><ol>${L.q.map(q=>`<li>${q}</li>`).join("")}</ol><p class="hint">Responda de memória, depois confira na fonte. Sem gabarito de propósito.</p></div></details>
    <section class="resumo"><h2>${n===10?"Resumo final":"Meu resumo da aula "+L.n}</h2>
      <p class="hint">${L.sum}</p>
      <textarea id="nt" aria-label="Resumo da aula ${L.n}" placeholder="Escreva com as suas palavras o que você aprendeu..."></textarea>
      <div class="cnt" id="wc"></div></section>
    <nav class="pn">${prev?`<a href="#aula-${prev.n}"><small>← anterior</small>Aula ${prev.n}: ${prev.t}</a>`:`<a href="#"><small>← início</small>Todas as aulas</a>`}${nx?`<a class="r" href="#aula-${nx.n}"><small>próxima →</small>Aula ${nx.n}: ${nx.t}</a>`:`<a class="r" href="#"><small>fim →</small>Todas as aulas</a>`}</nav>
  </div></main>`;
  app.querySelectorAll("input.c").forEach(cb=>cb.addEventListener("change",e=>{
    if(e.target.checked)st.done[e.target.id]=1;else delete st.done[e.target.id];
    save();const y=window.scrollY;lesson(n);top_();window.scrollTo(0,y)}));
  app.querySelectorAll(".sc button").forEach(b=>b.addEventListener("click",()=>{
    st.diag[b.dataset.k]=Number(b.dataset.v);save();const y=window.scrollY;lesson(n);window.scrollTo(0,y)}));
  const ta=document.getElementById("nt"),wc=document.getElementById("wc");
  ta.value=st.notes[n]||"";
  const upd=()=>{wc.textContent=words(ta.value)+" palavras"+(words(ta.value)>=30?" · resumo registrado":" · escreva ao menos 30 palavras para registrar")};
  upd();
  ta.addEventListener("input",()=>{st.notes[n]=ta.value;save();upd()});
}

function top_(){document.getElementById("topst").textContent=pad(allDoneH())+" / "+TOTAL+" h"}
function route(){
  const m=/^#aula-(\d+)$/.exec(location.hash);
  if(m)lesson(Number(m[1]));else home();
  top_();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
