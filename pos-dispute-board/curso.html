const FICHAS=[{"id":"adm-contratual","t":"Administração contratual de obras","o":"Administração contratual é o conjunto de rotinas que mantém o contrato sob controle durante a obra: ler e interpretar as cláusulas, acompanhar prazo, preço e escopo, registrar eventos, notificar, aprovar mudanças, medir e pagar. O objetivo é impedir que um fato da obra vire disputa sem prova.","q":"Da assinatura ao termo de recebimento, seja no contratante, no contratado ou numa consultoria.","c":["Monte a matriz do contrato: prazos, preço, medição, reajuste, mudança, notificação, penalidades e resolução de disputas.","Crie a rotina de registro: diário de obra, atas, cartas com protocolo, fotos datadas, medições.","Controle mudanças por ordem formal, antes do fato ou logo depois dele.","Consolide prazo, custo e escopo num relatório periódico.","Revise a matriz a cada aditivo."],"e":["Conhecer o contrato só no momento da disputa.","Aceitar mudança verbal.","Deixar passar o prazo de notificação.","Misturar prazo e dinheiro no mesmo pedido."],"f":"Código Civil, arts. 610 a 626 (empreitada); o contrato da sua obra."},{"id":"empreitada-regimes","t":"Empreitada: regimes de preço e quem carrega o risco","o":"O regime de preço define quem carrega o risco de quantidade e de custo. É a primeira pergunta ao analisar qualquer pleito.","q":"Ao ler um contrato, ao preparar um aditivo e ao decidir se um evento é risco do contratado ou do contratante.","c":["Preço global: valor fechado para a obra definida em projeto. O risco de quantitativo é do contratado, salvo mudança de projeto ou de escopo.","Preço unitário: paga-se por unidade efetivamente medida. O risco de variação de quantidade é do contratante.","Administração: o contratante reembolsa custos mais uma taxa. O risco de custo é do contratante.","EPC ou turn-key: o contratado responde por projeto, suprimento e construção, e absorve o risco das interfaces.","Identifique no contrato qual cláusula define o regime e se há mistura de itens globais e unitários.","Veja o critério de medição e quem responde por erro de projeto."],"e":["Achar que preço global impede qualquer aditivo: mudança de escopo e fato extraordinário continuam possíveis.","Ignorar a planilha de preços, que é anexo contratual.","Confundir o regime do contrato com o regime de cada item."],"f":"Código Civil, arts. 610 a 626; art. 618 (garantia de cinco anos pela solidez e segurança); Lei 14.133/2021, definições de regimes de execução (confirme o artigo no texto)."},{"id":"matriz-risco","t":"Matriz de risco","o":"Tabela que aloca, evento por evento, quem assume o risco, quem paga e quem ganha prazo. Todo pleito nasce na fronteira entre um risco do contratante e um do contratado.","q":"Na elaboração do contrato, no aditivo e na defesa de um pleito.","c":["Liste os eventos prováveis: chuva atípica, interferências, licenças, variação de insumos, projeto incompleto, descobertas no solo, atraso de fornecimento.","Classifique probabilidade e impacto de cada um.","Aloque cada risco a uma parte e diga quem arca com prazo e custo se ele ocorrer.","Defina mitigação e o gatilho para pedir reequilíbrio.","Ligue cada risco à cláusula que o sustenta."],"e":["Matriz genérica, sem os eventos reais da obra.","Risco alocado ao contratado sem preço correspondente.","Matriz que não se reflete nas cláusulas de prazo e preço."],"f":"Lei 14.133/2021 (a matriz de alocação de riscos é definida no art. 6º e tratada no art. 22; confirme no texto); entendimento do TCU sobre matriz de riscos."},{"id":"gestao-mudancas","t":"Gestão de mudanças e ordem de mudança","o":"Toda alteração de escopo, prazo ou preço deve passar por um fluxo formal. A ordem de mudança é o documento que prova que a parte certa autorizou, com o efeito em prazo e custo.","q":"Sempre que a obra diverge do projeto ou do contrato.","c":["Identifique a variação e registre a data e a causa.","Estime o impacto em prazo e custo.","Submeta a solicitação a quem tem poder de aprovar.","Emita a ordem com escopo, prazo e preço.","Atualize cronograma e orçamento.","Arquive a ordem junto com a documentação que a sustenta."],"e":["Executar antes da ordem.","Ordem que muda escopo mas não diz o efeito em prazo e preço.","Não atualizar o cronograma depois da ordem."],"f":"Cláusulas de alteração do seu contrato; Lei 14.133/2021, arts. 124 a 136, para obra pública."},{"id":"aditivos-14133","t":"Alterações contratuais na Lei 14.133 e limites de aditivo","o":"A Lei 14.133/2021 trata das alterações dos contratos nos arts. 124 a 136. A Administração pode alterar unilateralmente (para adequar o projeto ou ajustar quantidades) e as partes podem alterar por acordo (inclusive para restabelecer o equilíbrio econômico-financeiro).","q":"Obras e serviços públicos que precisam de acréscimo, supressão ou mudança de projeto.","c":["Justifique tecnicamente a alteração.","Confira o limite do art. 125: acréscimos e supressões de até 25% do valor inicial; até 50% para reforma de edifício ou de equipamento.","Verifique como o seu órgão calcula os limites (há debate sobre compensar acréscimos e supressões).","Verifique se a mudança tem preço de referência compatível (SINAPI, SICRO ou outro).","Formalize por termo aditivo antes de executar."],"e":["Executar serviço novo sem aditivo.","Confundir aditivo de quantidade com reequilíbrio.","Aplicar o limite de 25% sem checar a base de cálculo."],"f":"Lei 14.133/2021, arts. 124 a 136 (confirme no texto oficial); orientações do TCU."},{"id":"reajuste-repactuacao-reequilibrio","t":"Reajuste, repactuação e reequilíbrio","o":"São ferramentas diferentes para manter o contrato justo ao longo do tempo. Confundi-las é erro comum e custa o pleito.","q":"Quando custos mudam durante a obra.","c":["Reajuste: aplica o índice previsto no contrato, em geral a cada 12 meses. Não exige fato extraordinário.","Repactuação: própria de serviços contínuos com mão de obra dedicada, com base na variação dos custos e em convenção coletiva.","Reequilíbrio: recompõe o equilíbrio inicial quando um fato extraordinário ou uma alteração o rompe. A lei cita força maior, caso fortuito e fato do príncipe (art. 124, II, d).","Segundo a orientação do TCU, o pedido de reequilíbrio deve ser feito durante a vigência do contrato e antes de eventual prorrogação.","Documentos típicos do pedido: demonstrativo do fato, planilha de custos antes e depois, notas fiscais, índices, laudo técnico e cronologia."],"e":["Pedir reequilíbrio para o que o reajuste já cobre.","Pedido sem planilha, sem nexo e sem documento de suporte.","Esperar a prorrogação ou o fim do contrato para pedir."],"f":"Lei 14.133/2021, art. 124, II, d; orientações do TCU sobre reequilíbrio (página Licitações e Contratos e estudo do TCU sobre obras)."},{"id":"pleito-estrutura","t":"Estrutura de um pleito","o":"Um pleito completo responde a quatro perguntas: o que aconteceu, de quem é o risco, que efeito teve em prazo e custo e o que se pede. Prazo e dinheiro são pedidos separados.","q":"Ao montar, ao revisar ou ao contestar um pedido de prazo ou valor.","c":["Resumo do pedido, com prazo e valor solicitados.","Fatos e cronologia, com data e documento para cada fato.","Cláusulas contratuais aplicáveis e a alocação de risco.","Nexo causal: como o evento causou o efeito.","Análise de prazo, com o método e o cronograma usados.","Quantificação de custo, com planilha e memória de cálculo.","Pedido final e anexos numerados."],"e":["Narrar sem provar.","Pedir valor sem provar o prazo, ou o contrário.","Anexos sem numeração e sem ligação com o texto."],"f":"Prática de claims de construção; guias de claims em inglês (por exemplo os vídeos desta aula) e a documentação do seu contrato."},{"id":"notificacao-preclusao","t":"Notificação e preclusão","o":"Preclusão é a perda de uma faculdade pelo decurso do prazo ou por conduta incompatível com o direito. Em contratos de obra, notificação tardia ou aceitação sem ressalva pode ser usada contra o pleito.","q":"Em qualquer contrato com prazo para avisar eventos, medir, receber e aditar.","c":["Faça a matriz de notificações: evento, prazo, destinatário e forma.","Notifique o evento no prazo, mesmo sem conhecer todo o efeito, e reserve o direito de detalhar depois.","Inclua ressalva expressa em medições, recibos e termos de aditivo: sem prejuízo do pleito sobre o evento tal.","Guarde a prova de recebimento (protocolo, e-mail com leitura, ata assinada).","Acompanhe com notificações de continuidade enquanto o efeito durar."],"e":["Assinar quitação ou aditivo sem ressalva.","Notificar sem identificar o evento e a cláusula.","Enviar a notificação para destinatário diferente do indicado no contrato."],"f":"Cláusulas de notificação do contrato; vídeo da aula sobre preclusão lógica na revisão contratual. Os efeitos jurídicos variam por caso: confirme com advogado."},{"id":"prova-contemporanea","t":"Prova contemporânea","o":"É a prova que nasce no momento do fato. Pesa mais do que a reconstrução posterior, que é mais cara e mais fácil de contestar.","q":"Durante toda a obra, e na preparação de qualquer pleito.","c":["Diário de obra: data, clima, efetivo, equipamentos, serviços executados, ocorrências e impedimentos, com assinatura.","Fotos e vídeos datados, com localização.","Atas de reunião assinadas e cartas com protocolo.","Medições e atualizações de cronograma por período.","Registros de entrega de insumos e de ordens de serviço.","Cruzamento: o mesmo fato aparece em mais de um documento."],"e":["Diário preenchido de uma vez só, depois dos fatos.","Registro genérico, sem causa e sem frente de serviço.","Cronograma que não é atualizado por meses."],"f":"Rotinas do seu contrato; materiais de diário de obra e de provas em claims (vídeo da aula e artigo da ABA sobre documentação)."},{"id":"cpm-folgas","t":"Caminho crítico e folgas","o":"O caminho crítico é a sequência de atividades que define a data final. Atrasar uma atividade crítica atrasa a obra.","q":"Ao ler qualquer cronograma e ao analisar atraso.","c":["Passada à frente: início cedo (ES) e término cedo (EF = ES + duração).","Passada atrás: término tarde (LF) e início tarde (LS = LF − duração).","Folga total (TF) = LS − ES. Quanto a atividade pode atrasar sem atrasar o término da obra.","Folga livre (FF) = ES da sucessora − EF da atividade. Quanto pode atrasar sem atrasar a sucessora.","Caminho crítico: atividades com folga total mínima (zero, ou negativa se o prazo já estourou).","Em obras, a logística e a mão de obra podem criar um caminho crítico de recursos que o CPM puro não mostra."],"e":["Confundir folga total com folga livre.","Restrições de data que criam caminho crítico artificial.","Calendários diferentes entre atividades sem querer."],"f":"PMI, Practice Standard for Scheduling; AACE RP 49R-06 (identificação do caminho crítico); confirme edições."},{"id":"auditoria-cronograma","t":"Auditoria de cronograma: DCMA 14 pontos","o":"A avaliação de 14 pontos da DCMA é um conjunto de testes para saber se um cronograma serve como ferramenta de gestão. Os resultados são orientações, não regras de aprovação.","q":"Antes de usar um cronograma como base de análise de atraso.","c":["Lógica: atividades sem predecessora ou sucessora.","Leads (adiantamentos) e lags (esperas): uso excessivo mascara a lógica.","Tipos de relação: a maioria deve ser fim-início.","Restrições rígidas de data.","Folga alta e folga negativa.","Durações muito longas.","Datas inválidas.","Recursos.","Tarefas atrasadas.","Teste do caminho crítico.","Índice do caminho crítico (CPLI).","Índice de execução da linha de base (BEI).","Para cada teste, registre o resultado e o que ele significa para a sua análise. Os limites típicos são os da literatura e do guia do GAO; confirme na fonte."],"e":["Tratar o limite como aprovação automática.","Corrigir o cronograma antes de registrar o estado original.","Ignorar o que os defeitos significam para a prova."],"f":"DCMA 14-Point Assessment; GAO Schedule Assessment Guide (GAO-16-89G)."},{"id":"delay-visao-geral","t":"Visão geral da análise de atraso: os nove métodos da AACE 29R-03","o":"A RP 29R-03 descreve nove métodos de análise forense de cronograma (MIPs 3.1 a 3.9) e fatores para escolher entre eles. Não manda usar um método: exige justificar a escolha.","q":"Para decidir como provar um atraso.","c":["Observacional, estático, bruto: planejado contra realizado (3.1).","Observacional, estático, periódico (3.2).","Observacional, dinâmico, contemporâneo como está (3.3): análise por janelas.","Observacional, dinâmico, contemporâneo dividido (3.4).","Observacional, dinâmico, modificado ou recriado (3.5).","Modelado, aditivo, base única (3.6) e bases múltiplas (3.7): inserem atrasos no cronograma.","Modelado, subtrativo, simulação única (3.8) e bases múltiplas (3.9): retiram atrasos do cronograma real.","Escolha pelos dados disponíveis, pelo tamanho e complexidade do caso, pelo prazo e orçamento da análise e pelo contrato."],"e":["Escolher o método pelo resultado que ele dá.","Usar método modelado sem documentar as premissas.","Não justificar por que um método melhor não foi usado."],"f":"AACE RP 29R-03 (sumário público; texto completo para membros); revise a versão vigente, pois há rascunho de atualização."},{"id":"as-planned-vs-as-built","t":"Planejado contra realizado (MIPs 3.1 e 3.2)","o":"Compara o cronograma de linha de base com o cronograma realizado para mostrar onde e quando a obra se desviou. É o método mais simples.","q":"Quando não há atualizações confiáveis, ou como primeira visão antes de outros métodos.","c":["Obtenha a linha de base aceita e o cronograma realizado com datas reais.","Compare datas de início e término por atividade e por marco.","Identifique as atividades do caminho crítico que atrasaram.","No método periódico (3.2), repita a comparação por períodos.","Relacione os desvios aos eventos documentados."],"e":["Ignorar mudança de lógica entre a linha de base e o realizado.","Atribuir causa só pela data, sem documentos.","Tratar a comparação como prova de responsabilidade."],"f":"AACE RP 29R-03, MIPs 3.1 e 3.2."},{"id":"janelas","t":"Análise por janelas (MIPs 3.3 a 3.5)","o":"Divide a obra em períodos (janelas) entre atualizações do cronograma e mede, em cada janela, como o caminho crítico mudou e que evento causou a mudança. Soma o resultado das janelas.","q":"Quando há uma sequência de atualizações confiáveis. É em geral o método mais defensável.","c":["Reúna a linha de base e todas as atualizações, com o avanço real.","Defina as janelas, em geral entre uma atualização e a seguinte.","Em cada janela, calcule o caminho crítico no início e no fim e a variação da data final.","Identifique, com documentos, o evento que causou o atraso no caminho crítico daquela janela.","Atribua o atraso à parte responsável, segundo o contrato.","Some as janelas e confira com o atraso total."],"e":["Atualizações com dados reais incompletos.","Janelas longas demais, que escondem mudança de caminho crítico.","Atribuir causa sem documentos da época."],"f":"AACE RP 29R-03, MIPs 3.3 a 3.5; vídeos desta aula mostram exemplos no Primavera P6."},{"id":"collapsed-as-built","t":"Collapsed As-Built (MIPs 3.8 e 3.9)","o":"Parte do cronograma realizado e retira, por simulação, os atrasos atribuídos a uma parte para ver quando a obra teria terminado sem eles.","q":"Quando só há o cronograma realizado e é preciso atribuir responsabilidade por atraso.","c":["Reconstrua o cronograma realizado com lógica e datas reais.","Liste os atrasos por responsável, com documentos.","Retire (colapse) os atrasos de uma parte, um de cada vez ou em grupo.","Recalcule o término. A diferença é o efeito daqueles atrasos.","Documente as premissas de lógica que você adicionou."],"e":["Reconstruir a lógica com premissas do analista que a outra parte contesta.","Colapsar atrasos sem prova contemporânea.","Esquecer atrasos da outra parte."],"f":"AACE RP 29R-03, MIPs 3.8 e 3.9; vídeo da aula sobre os métodos de colapso."},{"id":"tia","t":"Time Impact Analysis (TIA)","o":"Insere o evento num cronograma aceito e vigente e compara o término antes e depois. A RP 52R-06 trata da versão prospectiva, feita durante a obra. A própria prática avisa que quanto maior o intervalo entre o evento e a aprovação do TIA, menos útil e válido ele é.","q":"Para pedir prorrogação enquanto o evento acontece, ou como método retrospectivo por janelas.","c":["Escolha o último cronograma aceito antes do evento.","Atualize o cronograma até a data do evento.","Monte a rede do evento (fragnet): atividades, durações e relações.","Insira a rede no cronograma, recalcule e compare o término.","Documente as premissas e anexe o arquivo do cronograma.","Se for retrospectivo, repita por janelas."],"e":["Inserir o evento num cronograma desatualizado.","Premissas de duração sem base.","Não mostrar a rede do evento."],"f":"AACE RP 52R-06; vídeos e casos da aula sobre TIA."},{"id":"atraso-concorrente-scl","t":"Atraso concorrente e o protocolo SCL","o":"Atraso concorrente ocorre quando duas ou mais causas, de partes diferentes, atrasam o término ao mesmo tempo. Há debate sobre a definição (literal ou funcional) e sobre o efeito.","q":"Quando o contratante e o contratado contribuem para o mesmo atraso.","c":["Defina o que o contrato diz sobre prorrogação e custo em atraso concorrente.","Identifique, por janela, as causas de cada parte que afetam o caminho crítico no mesmo período.","Verifique se os atrasos são realmente simultâneos no caminho crítico.","O protocolo SCL, em geral, trata a concorrência como rara e, quando ocorre, tende a conceder prazo sem custo à parte que não deu causa exclusiva; confirme no texto da 2ª edição.","Compare com o tratamento da AACE e com o seu contrato."],"e":["Chamar de concorrente o que é sequencial.","Aplicar a regra de um protocolo como se fosse lei.","Ignorar a regra do contrato."],"f":"SCL Delay and Disruption Protocol, 2ª ed. (2017); AACE RP 29R-03; artigo comparativo da Mondaq."},{"id":"bdi-tcu","t":"BDI e o Acórdão 2622/2013 do TCU","o":"BDI é a taxa aplicada ao custo direto para cobrir administração central, seguros e garantias, riscos, despesas financeiras, lucro e tributos. O Acórdão 2622/2013 fixou faixas de referência por tipo de obra.","q":"Na formação de preço de aditivos e na defesa de preço em obra pública.","c":["Separe o que é custo direto e o que é BDI.","A fórmula usada no acórdão é: BDI = [((1 + AC + S + G + R) × (1 + DF) × (1 + L)) ÷ (1 − I)] − 1, em que AC é administração central, S seguro, G garantia, R risco, DF despesas financeiras, L lucro e I tributos sobre a receita. Confirme na íntegra do acórdão.","Compare o BDI do contrato com as faixas do acórdão para o tipo de obra.","Em aditivos, use o BDI contratual e não o médio do mercado.","Se houver BDI diferenciado, siga a regra aplicável (um vídeo da aula cita o Acórdão 2340/2024 sobre equipamentos; confira)."],"e":["Aplicar BDI cheio a itens que o contrato trata diferente.","Contar duas vezes a administração local no BDI e no custo direto.","Usar faixa de obra diferente da do contrato."],"f":"Acórdão 2622/2013-TCU-Plenário (texto integral)."},{"id":"custo-atraso","t":"Custo de atraso (prolongamento do prazo)","o":"É o custo de manter a obra ativa por mais tempo do que o previsto. Diferente do custo de perda de produtividade.","q":"Em pleitos de prorrogação com custo.","c":["Liste os custos que dependem do tempo: administração local, canteiro, equipamentos, seguros, garantia, vigilância.","Calcule o custo por dia (ou mês) a partir do orçamento ou do realizado.","Multiplique pelo número de dias de atraso atribuídos à outra parte e aprovados.","Evite duplicidade com o BDI: a administração central em geral está no BDI.","Desconte o custo de períodos de atraso concorrente ou de responsabilidade do contratado, conforme o contrato.","Anexe comprovantes: folha, notas e medições."],"e":["Aplicar uma taxa única sem comprovar.","Pedir custo de dias que o contrato não reconhece.","Contar o mesmo custo em dois lugares."],"f":"Cláusulas de custo e prazo do contrato; prática de quantum em claims."},{"id":"measured-mile","t":"Measured Mile: perda de produtividade","o":"Compara a produtividade de um período afetado com a de um período comparável não afetado, na mesma obra. É um dos métodos preferidos para estimar perda de produtividade.","q":"Quando interferências (mudanças, aceleração, congestionamento) reduziram o rendimento da mão de obra.","c":["Defina o serviço medido e a unidade (por exemplo m² de alvenaria).","Escolha um trecho sem interferência, comparável em tipo de serviço e condições.","Calcule a produtividade do trecho não afetado: horas ÷ quantidade.","Calcule a do trecho afetado.","Horas perdidas = horas reais do trecho afetado − (quantidade afetada × produtividade do trecho não afetado).","Converta em custo com a taxa de mão de obra e anexe os registros."],"e":["Trecho 'normal' que também tem interferência.","Comparar serviços diferentes.","Sem registros diários de horas e de produção."],"f":"AACE RP 25R-03 (data de 2004; confirme atualização); artigos da FTI e da AGC citados na aula."},{"id":"evm","t":"Valor agregado (EVM)","o":"Compara o previsto, o realizado em valor e o custo real para dar sinal precoce de desvio de prazo e custo. É ferramenta de controle; não prova nexo causal sozinha.","q":"No acompanhamento mensal e na revisão de desvios.","c":["PV (valor planejado): o que deveria estar feito até a data.","EV (valor agregado): o valor do trabalho realmente feito.","AC (custo real): o que se gastou.","Variações: SV = EV − PV; CV = EV − AC.","Índices: SPI = EV ÷ PV (prazo); CPI = EV ÷ AC (custo). Abaixo de 1 é desfavorável.","Estimativa no término (EAC) comum: BAC ÷ CPI, se o desempenho atual persistir."],"e":["Medir EV com percentual subjetivo.","Usar SPI como se fosse atraso em dias.","Esquecer que o índice agrega todo o trabalho, não só o caminho crítico."],"f":"PMI, Standard for Earned Value Management (2020)."},{"id":"dispute-boards","t":"Dispute Boards: modelos e funcionamento","o":"Dispute Board é um comitê, em geral de três profissionais, que acompanha o contrato e resolve divergências durante a obra.","q":"Em obras de longo prazo e de maior complexidade.","c":["DRB (Dispute Review Board): emite recomendações. Nas regras da ICC, elas passam a vincular se nenhuma parte objetar em 30 dias.","DAB (Dispute Adjudication Board): emite decisões de cumprimento imediato.","CDB (Combined Dispute Board): combina os dois conforme o caso.","Serviços previstos nas regras da ICC: prevenção de divergências, assistência informal e referência formal para uma conclusão.","Cláusula contratual: defina o modelo, a nomeação, os prazos, os custos e o efeito da decisão."],"e":["Comitê que só se reúne na crise.","Cláusula vaga sobre efeito da decisão.","Nomear membro sem conhecer prazo e custo."],"f":"ICC Dispute Board Rules 2015 (apêndices de 2018); manual da DRBF (acesso de membro)."},{"id":"db-brasil","t":"Dispute Boards no Brasil","o":"No Brasil, o comitê de resolução de disputas é tratado pela Lei 14.133/2021, arts. 151 a 154 (meios alternativos de solução de controvérsias), por regulamentos de câmaras e pela doutrina.","q":"Ao redigir a cláusula de resolução de disputas em contrato de obra.","c":["Leia os arts. 151 a 154 da Lei 14.133.","O Enunciado 6 da I Jornada de Prevenção e Solução Extrajudicial de Litígios do CJF trata o comitê como método consensual de solução de conflito (art. 3º, §3º, do CPC); confira o texto do enunciado.","O regulamento de arbitragem do CBMA de 2025 trata de arbitragem, mediação e dispute board.","O CAM-CCBC também tem regulamento próprio; confirme a versão vigente.","A eficácia executiva da decisão do comitê é matéria em consolidação: confirme jurisprudência com advogado."],"e":["Copiar cláusula internacional sem adaptar ao direito brasileiro.","Não prever o efeito da decisão.","Citar lei estadual sem confirmar o número (um vídeo da aula cita uma, do Rio Grande do Sul)."],"f":"Lei 14.133/2021, arts. 151 a 154; Enunciados da I Jornada do CJF; regulamentos do CBMA e do CAM-CCBC."},{"id":"laudo-pericial","t":"Laudo e relatório técnico de pleito","o":"O laudo ou relatório técnico transforma a análise em documento que um terceiro pode ler e reproduzir.","q":"Na entrega do pleito, na perícia e na defesa perante um comitê.","c":["Objeto e quesitos: o que se pede e o que se responde.","Documentos examinados, com lista e data.","Metodologia: método de análise de atraso e de quantum, e por que foi escolhido.","Análise: dados, cálculos e resultados, com tabelas e gráficos.","Conclusões: respostas objetivas aos quesitos.","Premissas e limitações, em destaque.","Anexos numerados, com os arquivos de cronograma e planilhas."],"e":["Conclusão sem metodologia.","Premissa escondida.","Anexo que o leitor não consegue reproduzir."],"f":"Normas de perícia aplicáveis e modelos citados nos vídeos da aula."},{"id":"ciclo-claim","t":"Ciclo de um claim de prazo e custo","o":"O caminho de um pleito, da ocorrência do evento à decisão.","q":"Como roteiro diante de qualquer pleito novo.","c":["Identificar o evento e a cláusula aplicável.","Notificar no prazo e reservar o direito.","Registrar o que acontece, com prova contemporânea.","Auditar o cronograma.","Escolher e aplicar o método de análise de atraso.","Quantificar prazo e custo, separados.","Montar e submeter o pleito, com anexos.","Negociar e, se falhar, levar ao comitê de disputas ou à arbitragem."],"e":["Pular direto para o valor.","Escolher o método depois de ver o resultado.","Deixar o pleito para o fim da obra."],"f":"Aulas 2 a 9 do curso; vídeos de ciclo de claim da aula 10."}];
const LESSONS=[{"n":1,"t":"Orientação e diagnóstico","goal":"Entender o que você está construindo, medir de onde parte e ver como é o trabalho de quem administra contratos de obra.","intro":["Alexis, o objetivo desta pós não é acumular horas de vídeo. É sair capaz de fazer quatro coisas com um contrato de obra na mão: ler onde está o risco, registrar o que acontece, provar quanto prazo e quanto dinheiro cada evento custou e levar isso a uma negociação ou a um comitê de disputas.","A tese que organiza tudo: pleito é prova, não argumento. A maioria dos pleitos de obra perde porque a notificação saiu fora do prazo, o diário de obra não registrou o evento e o cronograma não permite medir o atraso, não porque o direito é fraco. Por isso o curso começa no contrato, passa por cronograma e custo e só então chega ao Dispute Board.","O perfil que você está formando é o de administrador contratual e analista de pleitos de obra: gerente de contratos de construtora, consultor de claims, assessor de comitê de disputas e, mais adiante, candidato a membro de comitê.","O diagnóstico abaixo tem nove competências. Cada uma traz uma explicação, um vídeo e o texto da técnica. Assista, leia o texto e só então dê a sua nota: assim a nota mede o que você sabe depois de ver o básico, e o resultado aponta onde reforçar.","Como estudar cada aula: leia a explicação, assista aos vídeos principais na ordem, abra as leituras indicadas e, no fim, escreva o seu resumo do que aprendeu. O resumo é o único texto que você escreve. Ele serve para fixar e vira o seu material de revisão.","Limites. O curso é técnico e de gestão, não parecer jurídico. Prazos, efeitos de decisões e jurisprudência devem ser confirmados com advogado e na fonte oficial antes de uso em um caso real."],"steps":[{"k":"vídeo","t":"Contratos em espécie (resumo), Direito Civil","why":"Competência: Contrato de obra no direito privado.","h":1,"u":"https://www.youtube.com/watch?v=PzR4B7UMilE","pick":"P","src":"YouTube · 28,9 mil visualizações · ago/2025 · português · 17 min","f":"empreitada-regimes","d":"d1"},{"k":"vídeo","t":"Licitações e contratos: resumo da Lei 14.133 (Prof. Herbert Almeida)","why":"Competência: Lei 14.133, reequilíbrio e TCU.","h":1,"u":"https://www.youtube.com/watch?v=qXe73cK0lkU","pick":"P","src":"YouTube · 152 mil visualizações · set/2026 · português · 57 min","f":"reajuste-repactuacao-reequilibrio","d":"d2"},{"k":"vídeo","t":"Notificação extrajudicial: tudo o que você precisa saber","why":"Competência: Notificação, registro e estrutura de pleito.","h":1,"u":"https://www.youtube.com/watch?v=yqqXV593NAw","pick":"P","src":"YouTube · 13,5 mil visualizações · nov/2024 · português · 23 min","f":"notificacao-preclusao","d":"d3"},{"k":"vídeo","t":"Método do Caminho Crítico (CPM) de forma simples","why":"Competência: Cronograma e CPM.","h":1,"u":"https://www.youtube.com/watch?v=ijZ8AISuYZo","pick":"P","src":"YouTube · 66 mil visualizações · mar/2025 · inglês · 24 min","f":"cpm-folgas","d":"d4"},{"k":"vídeo","t":"Fragnet e Time Impact Analysis (TIA) no Primavera P6 (outra explicação)","why":"Competência: Análise de atraso e métodos da AACE 29R-03.","h":1,"u":"https://www.youtube.com/watch?v=a-pl85wE-t8","pick":"P","src":"YouTube · 13,3 mil visualizações · mar/2026 · inglês · 18 min","f":"delay-visao-geral","d":"d5"},{"k":"vídeo","t":"TIA parte 2: Visualizer no Primavera P6, mostrando o impacto do atraso","why":"Competência: Atraso concorrente e TIA.","h":1,"u":"https://www.youtube.com/watch?v=zpgf-U-2Ero","pick":"P","src":"YouTube · 23,4 mil visualizações · mar/2026 · inglês · 15 min","f":"tia","d":"d6"},{"k":"vídeo","t":"Como usar a tabela SINAPI 2026 em orçamentos de obra (Eng. Alex Wetler)","why":"Competência: BDI, custo de atraso e perda de produtividade.","h":1,"u":"https://www.youtube.com/watch?v=Ld-hcGEjMgI","pick":"P","src":"YouTube · 23,4 mil visualizações · jul/2025 · português · 20 min","f":"bdi-tcu","d":"d7"},{"k":"vídeo","t":"Valor Agregado (EVM) explicado em 11 minutos","why":"Competência: Valor agregado (EVM).","h":1,"u":"https://www.youtube.com/watch?v=vyT2YrgHHJo","pick":"P","src":"YouTube · 33,5 mil visualizações · nov/2025 · inglês · 11 min","f":"evm","d":"d8"},{"k":"texto","t":"Texto: Dispute Boards e resolução de disputas","why":"Nenhum vídeo com mais de 10 mil visualizações, até 2 anos e pelo menos 10 minutos foi encontrado para este tema. Use o texto.","h":0,"u":"#ficha-dispute-boards","pick":"A","src":"Texto do curso","f":"dispute-boards","d":"d9"},{"k":"vídeo","t":"Gestão de contratos (Prof. Thallius Moraes, Esquadrão de Elite)","why":"Aula longa em português sobre gestão de contratos; visão geral do trabalho.","h":2,"u":"https://www.youtube.com/watch?v=Y2k2BXzsc3s","pick":"P","src":"YouTube · 12,9 mil visualizações · mai/2025 · português · 1h32","f":"adm-contratual"},{"k":"texto","t":"Texto técnico da aula 1","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":1,"u":"#texto-1","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":1,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"Gestão e planejamento de obras (podcast Construecast)","why":"Podcast em português sobre gestão e planejamento de obras.","h":0,"u":"https://www.youtube.com/watch?v=0AXX0FYmm04","pick":"A","src":"YouTube · 15,9 mil visualizações · dez/2024 · português · 1h12","f":"adm-contratual"},{"k":"vídeo","t":"Guia completo de gerenciamento de projetos de construção (Tim Fairley)","why":"Muito longo (quase 9 horas); veja trechos se quiser.","h":0,"u":"https://www.youtube.com/watch?v=wFGouP9ubcg","pick":"A","src":"YouTube · 313 mil visualizações · jul/2025 · inglês · 8h57","f":"adm-contratual"}],"q":["Qual obra e qual tipo de evento (atraso, aditivo, perda de produtividade) serão seu caso de referência ao longo do curso?","O que você quer ser capaz de fazer em 10 semanas que hoje não faz?"],"sum":"Escreva: (1) o que faz um administrador contratual de obra; (2) por que pleito é prova e não argumento; (3) quais as 3 competências em que você mais precisa evoluir, segundo o diagnóstico, e o que cada uma das nove significa em uma frase.","h":12},{"n":2,"t":"Fundamentos da administração contratual de obras","goal":"Empreitada, tipos de preço, risco e controle de mudanças: a base sem a qual o resto vira técnica sem contrato.","intro":["Na obra privada, o contrato manda e o Código Civil preenche as lacunas. A empreitada está nos arts. 610 a 626. O art. 618 impõe ao empreiteiro responsabilidade pela solidez e segurança da obra por cinco anos, prazo que as partes não reduzem por contrato.","O tipo de preço define quem carrega qual risco. No preço global, o contratado assume o risco de quantidade: se o projeto não mudou e ele errou o quantitativo, paga. No preço unitário, o contratante paga o que foi medido e carrega o risco de variação de quantidade. Na administração, o contratante reembolsa custos mais uma taxa. No EPC ou turn-key, o contratado assume projeto, suprimento e construção, e com isso o risco das interfaces.","A matriz de risco diz, para cada evento, quem paga e quem ganha prazo. Todo pleito nasce na fronteira entre um risco do contratante e um do contratado. Se a matriz é vaga, a disputa é certa.","Gestão de mudanças é o hábito que evita o pleito: toda alteração de escopo, prazo ou preço precisa de ordem formal, assinada por quem tem poder, antes ou logo depois de acontecer."],"steps":[{"k":"vídeo","t":"Introdução à gestão da construção: curso completo (Tim Fairley)","why":"Curso completo de introdução à gestão da construção.","h":2,"u":"https://www.youtube.com/watch?v=Tn3c2-prL7I","pick":"P","src":"YouTube · 14,9 mil visualizações · mar/2025 · inglês · 1h28","f":"adm-contratual"},{"k":"vídeo","t":"Gestão de contratos de construção: guia completo (Tim Fairley)","why":"Guia completo de gestão de contratos de construção.","h":2,"u":"https://www.youtube.com/watch?v=7GxhVRYF1aE","pick":"P","src":"YouTube · 21,6 mil visualizações · mai/2025 · inglês · 1h41","f":"adm-contratual"},{"k":"vídeo","t":"Gestão de riscos: aula completa (Prof. Marcelo Soares)","why":"Aula completa de gestão de riscos; base para a matriz de risco.","h":2,"u":"https://www.youtube.com/watch?v=TQPuT9IPYWs","pick":"P","src":"YouTube · 11,1 mil visualizações · jul/2025 · português · 1h40","f":"matriz-risco"},{"k":"vídeo","t":"Contratada: pontos de atenção na matriz de riscos","why":"Pontos de atenção do contratado na matriz de riscos.","h":1,"u":"https://www.youtube.com/watch?v=ItCgDbpxn1I","pick":"P","src":"YouTube · 16,2 mil visualizações · mar/2026 · português · 12 min","f":"matriz-risco"},{"k":"norma","t":"Código Civil, arts. 610 a 626: contrato de empreitada","why":"Fonte primária. Leia os artigos inteiros.","h":2,"u":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm","pick":"P","src":"Planalto"},{"k":"livro","t":"Comentários à Lei de Licitações e Contratações Administrativas (Marçal Justen Filho)","why":"Obra de referência sobre a Lei 14.133. Leia a parte de contratos e alterações. Página de livraria; confirme a edição.","h":1,"u":"https://www.martinsfontespaulista.com.br/comentarios-a-lei-de-licitacoes-e-contratacoes-administrativas---2025-1140457/p","pick":"P","src":"Livraria"},{"k":"texto","t":"Texto técnico da aula 2","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":1,"u":"#texto-2","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":1,"u":null,"pick":"P","src":"Textos do curso"},{"k":"curso","t":"Complemento FGV: MBA em Gestão, Incorporação e Construção Imobiliária","why":"Grade com contratos e aquisições. Opcional e pago, fora das 100 h.","h":0,"u":"https://educacao-executiva.fgv.br/rj/nova-iguacu/cursos/mba-pos-graduacao/mba-blended-semipresencial/mba-em-gestao-incorporacao-e-construcao-imobiliaria","pick":"A","src":"FGV"}],"q":["Qual a diferença de risco de quantitativo entre empreitada por preço global e por preço unitário?","Qual o prazo e o artigo do Código Civil sobre solidez e segurança da obra?","O que a matriz de risco do seu contrato aloca ao contratado e ao contratante?"],"sum":"Escreva: (1) as diferenças entre preço global, unitário, administração e EPC quanto a risco; (2) o que é uma matriz de risco e por que ela evita pleitos; (3) por que ordem formal de mudança importa.","h":12},{"n":3,"t":"Contratos públicos de obras: Lei 14.133 e TCU","goal":"Alteração contratual, reequilíbrio, reajuste e repactuação em obra pública.","intro":["Em obra pública, o contrato é administrativo: a Administração pode alterar unilateralmente dentro de limites, e o contratado tem direito à manutenção do equilíbrio econômico-financeiro. A Lei 14.133/2021 trata das alterações nos arts. 124 a 136. O art. 125 fixa os limites de acréscimos e supressões (25%, e 50% para reforma de edifício ou equipamento).","Três ferramentas, três usos. Reajuste aplica o índice previsto no contrato, em geral a cada 12 meses. Repactuação é própria de serviços contínuos com mão de obra. Reequilíbrio recompõe o equilíbrio inicial quando um fato extraordinário ou uma alteração o rompe; o art. 124, II, d, é a base citada para força maior, caso fortuito e fato do príncipe. Segundo orientação do TCU, o pedido deve ser feito durante a vigência do contrato e antes de eventual prorrogação.","O erro típico do contratado em obra pública é tratar o pedido de reequilíbrio como carta comercial. Ele precisa de fato, nexo, planilha e documentos de suporte. A ficha de reequilíbrio lista os documentos que acompanham o pedido."],"steps":[{"k":"vídeo","t":"Esquematizando licitações, Lei 14.133/21 (Prof. Thallius Moraes)","why":"Aula longa (quase 3 horas) sobre a Lei 14.133.","h":2,"u":"https://www.youtube.com/watch?v=fxHVG_i-zHA","pick":"P","src":"YouTube · 122 mil visualizações · nov/2024 · português · 2h42","f":"aditivos-14133"},{"k":"vídeo","t":"Licitações e contratos administrativos: domínio completo da Lei 14.133 (Gran Jurídico)","why":"Domínio completo da Lei 14.133, em 57 minutos.","h":1,"u":"https://www.youtube.com/watch?v=s4B0WBb-1kM","pick":"P","src":"YouTube · 38,3 mil visualizações · abr/2026 · português · 57 min","f":"aditivos-14133"},{"k":"vídeo","t":"Revisão estratégica: licitação, Lei 14.133/21 (Prof. Franco)","why":"Revisão estratégica da Lei 14.133.","h":1,"u":"https://www.youtube.com/watch?v=txu_wPPy8KA","pick":"P","src":"YouTube · 29,5 mil visualizações · mar/2026 · português · 1h17","f":"aditivos-14133"},{"k":"vídeo","t":"Acréscimo acima de 25% em contratos públicos: é possível?","why":"Responde se é possível ultrapassar 25% de acréscimo.","h":1,"u":"https://www.youtube.com/watch?v=wCB2g24Tm0c","pick":"P","src":"YouTube · 15,2 mil visualizações · set/2025 · português · 11 min","f":"aditivos-14133"},{"k":"vídeo","t":"O TCU pode autorizar acréscimos acima de 25%? Entenda o Acórdão 1753","why":"Trata do Acórdão 1753 do TCU sobre acréscimos acima de 25%.","h":1,"u":"https://www.youtube.com/watch?v=MeNQtzzmzY4","pick":"P","src":"YouTube · 29,3 mil visualizações · jul/2026 · português · 14 min","f":"aditivos-14133"},{"k":"norma","t":"Lei 14.133/2021: alterações (arts. 124 a 136) e extinção (a partir do art. 137)","why":"Fonte primária. Leia o capítulo de alterações inteiro.","h":2,"u":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","pick":"P","src":"Planalto"},{"k":"artigo","t":"TCU, Licitações e Contratos: reequilíbrio econômico-financeiro (recomposição ou revisão)","why":"Orientação do tribunal que fiscaliza.","h":1,"u":"https://licitacoesecontratos.tcu.gov.br/6-2-2-1-1-reequilibrio-economico-financeiro-recomposicao-ou-revisao-2","pick":"P","src":"TCU"},{"k":"pdf","t":"Reequilíbrio econômico-financeiro de contratos de obras públicas","why":"Estudo do TCU específico para obras.","h":1,"u":"https://portal.tcu.gov.br/data/files/0B/05/99/3A/2516E810943E72C8E18818A8/Reequilibrio%20economico-financeiro%20de%20contratos%20de%20obras%20publicas.pdf","pick":"P","src":"TCU"},{"k":"texto","t":"Texto técnico da aula 3","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":1,"u":"#texto-3","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":1,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"Licitações e contratos: resumo da Lei 14.133 (Prof. Herbert Almeida)","why":"Visto na aula 1: resumo da Lei 14.133.","h":0,"u":"https://www.youtube.com/watch?v=qXe73cK0lkU","pick":"R","src":"YouTube · 152 mil visualizações · set/2026 · português · 57 min","f":"reajuste-repactuacao-reequilibrio"},{"k":"vídeo","t":"Meu contrato não tem reajuste! O que a lei diz?","why":"O que a lei diz quando o contrato não prevê reajuste.","h":0,"u":"https://www.youtube.com/watch?v=9xDS9n5UHEk","pick":"A","src":"YouTube · 20 mil visualizações · dez/2025 · português · 10 min","f":"reajuste-repactuacao-reequilibrio"},{"k":"vídeo","t":"É possível reequilibrar uma ata de registro de preços?","why":"Reequilíbrio de ata de registro de preços.","h":0,"u":"https://www.youtube.com/watch?v=G1rFZqRkh5E","pick":"A","src":"YouTube · 84,7 mil visualizações · fev/2026 · português · 13 min","f":"reajuste-repactuacao-reequilibrio"},{"k":"vídeo","t":"Nova Lei de Licitações e Contratos Administrativos: resumo da Lei 14.133","why":"Resumo geral da Lei 14.133.","h":0,"u":"https://www.youtube.com/watch?v=TGKWT0Cdm-M","pick":"A","src":"YouTube · 46,6 mil visualizações · fev/2026 · português · 14 min","f":"aditivos-14133"},{"k":"vídeo","t":"Nova Lei de Licitações e Contratos, Lei 14.133/2021, esquematizada (Estratégia Concursos)","why":"Aula longa (quase 4 horas) sobre toda a Lei 14.133.","h":0,"u":"https://www.youtube.com/watch?v=Pecf9lc-UGo","pick":"A","src":"YouTube · 245 mil visualizações · set/2026 · português · 3h55","f":"aditivos-14133"},{"k":"artigo","t":"Lei 14.133 comentada: art. 124","why":"Comentário artigo por artigo.","h":0,"u":"https://www.tce.sp.gov.br/legislacao-comentada/lei-14133-1o-abril-2021/124","pick":"A","src":"TCE-SP"}],"q":["Quais as hipóteses de alteração unilateral e consensual do art. 124?","Quais os limites de acréscimos e supressões e a exceção para reforma?","Em que prazo e antes de qual evento o pedido de reequilíbrio deve ser feito?"],"sum":"Escreva: (1) a diferença entre reajuste, repactuação e reequilíbrio; (2) os limites de aditivo do art. 125; (3) quais documentos sustentam um pedido de reequilíbrio.","h":12},{"n":4,"t":"Pleito, notificação e registro contemporâneo","goal":"A aula que decide pleito: notificar no prazo, registrar o que aconteceu e provar o nexo.","intro":["Um pleito completo responde a quatro perguntas: o que aconteceu (evento), de quem é o risco (contrato), que efeito teve no prazo e no custo (nexo causal e quantificação) e o que se pede (prazo, valor ou ambos). Prazo e dinheiro são pedidos separados e se provam separados.","Notificação: quase todo contrato fixa um prazo para avisar a outra parte do evento. Perder esse prazo pode custar o direito, dependendo da cláusula e do que a lei permite. A ficha de notificação e preclusão trata desse risco.","Prova contemporânea é a que nasce no momento do fato: diário de obra, atas, e-mails, fotos datadas, cartas com protocolo, medições, atualizações de cronograma. Reconstruir depois é mais caro e mais fácil de contestar.","Não encontrei vídeo sobre pleito com mais de 10 mil visualizações e até 2 anos. Por isso esta aula se apoia na ficha, na apostila e no artigo da ABA; o vídeo sobre notificação, da aula 1, complementa."],"steps":[{"k":"vídeo","t":"Notificação extrajudicial: tudo o que você precisa saber","why":"Visto na aula 1: notificação extrajudicial.","h":0,"u":"https://www.youtube.com/watch?v=yqqXV593NAw","pick":"R","src":"YouTube · 13,5 mil visualizações · nov/2024 · português · 23 min","f":"notificacao-preclusao"},{"k":"artigo","t":"Delay Claims, Part II: Proving Delays, Required Documentation","why":"Artigo da ABA sobre a documentação necessária para provar atraso.","h":2,"u":"https://www.americanbar.org/groups/tort_trial_insurance_practice/resources/committee-articles/delay-claims-part-ii-proving-delays-required-documentation/","pick":"P","src":"ABA"},{"k":"texto","t":"Texto técnico da aula 4","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":2,"u":"#texto-4","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":1,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"Gestão de contratos de construção: guia completo (Tim Fairley)","why":"Guia de gestão de contratos de construção; tema próximo de pleito e notificação.","h":0,"u":"https://www.youtube.com/watch?v=7GxhVRYF1aE","pick":"A","src":"YouTube · 21,6 mil visualizações · mai/2025 · inglês · 1h41","f":"pleito-estrutura"},{"k":"curso","t":"Complemento FGV: Gestão de Disputas em Projetos de Infraestrutura (16 horas-aula)","why":"Curso curto de claims e disputas. Opcional, pago; confirme a próxima turma.","h":0,"u":"https://educacao-executiva.fgv.br/produto/gestao-de-disputas-em-projetos-de-infraestrutura-aspectos-teoricos-e-praticos-01tV200000Ij5RNIAZ","pick":"A","src":"FGV"}],"q":["Que registros contemporâneos provam a causa de um atraso?","Por que prazo e dinheiro precisam ser provados separadamente?"],"sum":"Escreva: (1) as quatro perguntas que um pleito completo responde; (2) o que é prova contemporânea e 4 exemplos; (3) o que pode acontecer se a notificação sair fora do prazo.","h":5},{"n":5,"t":"Cronograma e CPM: a base comum","goal":"Qualidade do cronograma, lógica, caminho crítico e folga. Análise de atraso sobre cronograma ruim produz número ruim.","intro":["O caminho crítico é a sequência de atividades que define a data final. Atrasar uma atividade crítica atrasa a obra. Folga total é quanto uma atividade pode atrasar sem atrasar o término; folga livre é quanto pode atrasar sem atrasar a sucessora.","Antes de qualquer análise, audite o cronograma: lógica aberta (atividades sem predecessora ou sucessora), restrições de data que forçam o caminho crítico, folga negativa, calendários inconsistentes e relações em excesso. Cada defeito dá ao outro lado um argumento contra a sua análise. A avaliação em 14 pontos da DCMA e o guia de avaliação de cronograma do GAO são referências usadas para isso.","A AACE publica práticas recomendadas de cronograma: lógica das atividades (RP 24R-03), identificação do caminho crítico (49R-06), documentação da base do cronograma (38R-06) e níveis de detalhe (37R-06). O PMI complementa com o Practice Standard for Scheduling."],"steps":[{"k":"vídeo","t":"Cronograma de obras: guia passo a passo dos caminhos críticos (Tim Fairley)","why":"Guia longo de cronograma de obras e caminhos críticos.","h":2,"u":"https://www.youtube.com/watch?v=IDaDI18u3Fw","pick":"P","src":"YouTube · 10,9 mil visualizações · abr/2026 · inglês · 1h43","f":"cpm-folgas"},{"k":"vídeo","t":"Aula de MS Project 2026 + e-book grátis (Expert Cursos)","why":"Aula de MS Project em português.","h":1,"u":"https://www.youtube.com/watch?v=zW6z_9Fa6Kg","pick":"P","src":"YouTube · 15,2 mil visualizações · jan/2026 · português · 36 min","f":"cpm-folgas"},{"k":"vídeo","t":"Verificação de cronograma DCMA 14 pontos no Primavera P6","why":"Verificação de qualidade do cronograma (DCMA 14 pontos) no Primavera P6.","h":1,"u":"https://www.youtube.com/watch?v=V0-o6nOlaK8","pick":"P","src":"YouTube · 10,1 mil visualizações · ago/2025 · inglês · 37 min","f":"auditoria-cronograma"},{"k":"pdf","t":"GAO Schedule Assessment Guide","why":"Guia público de avaliação de cronograma, com boas práticas de qualidade.","h":2,"u":"https://www.gao.gov/assets/d1689G.pdf","pick":"P","src":"GAO"},{"k":"norma","t":"PMI, Practice Standard for Scheduling, 3ª ed.","why":"Página do PMI. Confirme se a edição alinha ao PMBOK 6 ou 7.","h":3,"u":"https://www.pmi.org/pt-br/standards/scheduling-third-edition","pick":"P","src":"PMI"},{"k":"texto","t":"Texto técnico da aula 5","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":1,"u":"#texto-5","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":1,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"Método do Caminho Crítico (CPM) de forma simples","why":"Visto na aula 1: CPM e folgas.","h":0,"u":"https://www.youtube.com/watch?v=ijZ8AISuYZo","pick":"R","src":"YouTube · 66 mil visualizações · mar/2025 · inglês · 24 min","f":"cpm-folgas"},{"k":"vídeo","t":"Primavera P6 para iniciantes, aulas 1 a 4 (Phil Hirst)","why":"Introdução ao Primavera P6.","h":0,"u":"https://www.youtube.com/watch?v=J0Efqafp4XY","pick":"A","src":"YouTube · 59 mil visualizações · jul/2025 · inglês · 15 min","f":"cpm-folgas"},{"k":"artigo","t":"AACE RP 49R-06: identificação do caminho crítico e folga (guia de estudo)","why":"Resumo de terceiros sobre a RP 49R-06. Confirme na fonte da AACE.","h":0,"u":"https://open-exam-prep.com/study-guides/aace-psp/cpm-mechanics/float-calculations-critical-path-rp49r06","pick":"A","src":"Guia de estudo"}],"q":["O que diferencia folga total de folga livre?","Quais defeitos de lógica invalidam um cronograma como base de análise?","Como restrições de data distorcem o caminho crítico?"],"sum":"Escreva: (1) o que é caminho crítico e folga total e livre; (2) a lista dos defeitos de cronograma que você verificaria antes de analisar um atraso; (3) por que um cronograma ruim contamina a análise.","h":11},{"n":6,"t":"Análise de atraso: AACE RP 29R-03","goal":"Os nove métodos, como escolher entre eles e como são aplicados. Núcleo técnico do curso.","intro":["A RP 29R-03 descreve nove métodos de análise forense de cronograma, os MIPs 3.1 a 3.9, e os fatores para escolher entre eles. A norma não manda usar um método; exige que a escolha seja justificada. Foi publicada em 2007 e revisada em 2009 e 2011, e há rascunho de atualização em discussão: confirme a versão vigente no site da AACE. O texto completo é para membros ou compra; os links desta aula levam ao sumário e a leituras de apoio.","Os nove métodos: 3.1 observacional, estático, bruto (planejado contra realizado); 3.2 observacional, estático, periódico; 3.3 observacional, dinâmico, contemporâneo como está; 3.4 observacional, dinâmico, contemporâneo dividido; 3.5 observacional, dinâmico, modificado ou recriado; 3.6 modelado, aditivo, base única; 3.7 modelado, aditivo, bases múltiplas; 3.8 modelado, subtrativo, simulação única; 3.9 modelado, subtrativo, bases múltiplas.","Como ler a classificação: observacional compara cronogramas sem inserir ou retirar atrasos; modelado simula. Estático usa duas fotografias; dinâmico usa a sequência de atualizações. Aditivo insere os atrasos num cronograma; subtrativo os retira do cronograma real (o clássico collapsed as-built).","Posição prática: se o projeto tem atualizações mensais confiáveis, o método por janelas (observacional dinâmico, MIP 3.3) costuma ser o mais defensável. Se não tem, a escolha passa a ser um problema de dados. A crítica comum aos métodos modelados é a dependência de premissas do analista."],"steps":[{"k":"vídeo","t":"Time Impact Analysis (TIA) na prática no Primavera P6","why":"Análise de atraso (TIA) na prática no Primavera P6; tema próximo dos métodos da 29R-03.","h":1,"u":"https://www.youtube.com/watch?v=4wikVvRMEo8","pick":"P","src":"YouTube · 10,4 mil visualizações · mar/2025 · inglês · 28 min","f":"delay-visao-geral"},{"k":"pdf","t":"Sumário da RP 29R-03","why":"Mostra a estrutura dos nove métodos.","h":1,"u":"https://web.aacei.org/docs/default-source/toc/toc_29r-03.pdf?sfvrsn=4","pick":"P","src":"AACE"},{"k":"livro","t":"Construction Delay Claims (Bramble e Callahan), capítulos de análise de atraso","why":"Referência clássica. Página de livraria; confirme a edição.","h":4,"u":"https://readings.com.au/product/9781543823653/construction-delay-claims--barry-b-bramble-michael-t-callahan--2020--9781543823653","pick":"P","src":"Livraria"},{"k":"artigo","t":"Understanding Construction Scheduling","why":"Artigo da ABA que cita AACE 29R-03 e o protocolo SCL como referências.","h":1,"u":"https://www.americanbar.org/groups/tort_trial_insurance_practice/resources/journal/2022-fall/understanding-construction-scheduling","pick":"P","src":"ABA"},{"k":"texto","t":"Texto técnico da aula 6","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":4,"u":"#texto-6","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":1,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"Fragnet e Time Impact Analysis (TIA) no Primavera P6 (outra explicação)","why":"Visto na aula 1: análise de atraso.","h":0,"u":"https://www.youtube.com/watch?v=a-pl85wE-t8","pick":"R","src":"YouTube · 13,3 mil visualizações · mar/2026 · inglês · 18 min","f":"tia"},{"k":"artigo","t":"Alternativa: crítica à revisão da 29R-03","why":"Mostra o debate sobre os métodos modelados.","h":0,"u":"https://enr.com/articles/56770-forensic-schedulings-groundhog-day-dubious-practices-recommended-again","pick":"A","src":"ENR"},{"k":"curso","t":"Meta de certificação: AACE PSP, EVP e CCP","why":"Certificações da AACE em planejamento, valor agregado e custos. Opcional.","h":0,"u":"https://web.aacei.org/certification/certifications-offered/professional-certifications","pick":"A","src":"AACE"}],"q":["Cite os nove métodos da 29R-03 e a família a que cada um pertence.","Que qualidade de dados cada método exige?","Por que um método modelado e aditivo é mais contestável que um observacional?"],"sum":"Escreva: (1) os nove métodos e como se classificam; (2) como escolher entre eles; (3) em que situações você usaria janelas (MIP 3.3) e em que situações não; (4) as limitações de cada família.","h":12},{"n":7,"t":"TIA prospectivo e atraso concorrente","goal":"Impacto de tempo prospectivo e o confronto entre a AACE e o protocolo SCL.","intro":["O TIA (Time Impact Analysis) insere um evento no cronograma vigente para medir o efeito no término. A RP 52R-06 trata da versão prospectiva, feita durante a obra, para pedir prorrogação antes de o atraso se consumar. A própria norma avisa que quanto maior o intervalo entre o evento e a aprovação do TIA, menos útil e válida ele é.","Atraso concorrente é quando duas ou mais causas, de partes diferentes, atrasam o término no mesmo período. O tratamento varia por contrato, por jurisdição e por protocolo. O protocolo da Society of Construction Law (2ª edição, 2017) e a AACE divergem em alguns pontos; estudar a divergência é mais útil que escolher um lado.","No Brasil, a regra prática é ler o seu contrato: ele diz de quem é a folga, se há prorrogação sem custo para atraso concorrente e como se prova. O protocolo SCL não tem força de lei, a menos que o contrato o adote."],"steps":[{"k":"vídeo","t":"Fragnet e Time Impact Analysis (TIA) no Primavera P6, passo a passo","why":"Fragnet e TIA no Primavera P6, passo a passo.","h":1,"u":"https://www.youtube.com/watch?v=gMIh9_62LDk","pick":"P","src":"YouTube · 26,4 mil visualizações · fev/2026 · inglês · 17 min","f":"tia"},{"k":"artigo","t":"Harmonizing SCL DDP2 and AACE 29R-03","why":"Compara os dois documentos.","h":1,"u":"https://www.mondaq.com/unitedstates/arbitration-dispute-resolution/1702390/harmonizing-scl-dd2-and-aace-29r-03-complementary-frameworks-for-forensic-delay-analysis-in-international-arbitration","pick":"P","src":"Mondaq"},{"k":"artigo","t":"Prospective Time Impact Analysis in Forensics: a case study","why":"Caso prático.","h":1,"u":"https://ankura.com/insights/prospective-time-impact-analysis-in-forensics-a-case-study","pick":"P","src":"Ankura"},{"k":"pdf","t":"TIA Speaker Series (apresentação da CDM Smith)","why":"Apresentação em PDF, externa, sobre Time Impact Analysis.","h":1,"u":"https://cdmsmith.com/-/media/PowerPoint/TIA-Speaker-Series.pdf","pick":"P","src":"CDM Smith"},{"k":"texto","t":"Texto técnico da aula 7","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":3,"u":"#texto-7","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":2,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"TIA parte 2: Visualizer no Primavera P6, mostrando o impacto do atraso","why":"Visto na aula 1: TIA, parte 2.","h":0,"u":"https://www.youtube.com/watch?v=zpgf-U-2Ero","pick":"R","src":"YouTube · 23,4 mil visualizações · mar/2026 · inglês · 15 min","f":"tia"},{"k":"artigo","t":"The SCL Delay and Disruption Protocol: a second edition","why":"Resumo do que mudou na segunda edição.","h":0,"u":"https://www.fenwickelliott.com/research-insight/annual-review/2017/scl-delay-disruption-protocol-second-edition","pick":"A","src":"Fenwick Elliott"},{"k":"artigo","t":"SCL Delay and Disruption Protocol: take two","why":"Comentário sobre a segunda edição.","h":0,"u":"https://www.building.co.uk/communities/scl-delay-and-disruption-protocol-take-two/5082412.article","pick":"A","src":"Building"}],"q":["Quando um TIA prospectivo é melhor que uma análise retrospectiva?","Como o protocolo SCL e a AACE tratam o atraso concorrente?","De quem é a folga no seu contrato?"],"sum":"Escreva: (1) o que é TIA e quando é prospectivo ou retrospectivo; (2) o que é atraso concorrente e como o tratamento varia; (3) onde SCL e AACE divergem; (4) o que você precisa ler no seu contrato para decidir.","h":9},{"n":8,"t":"Quantum: BDI, produtividade e valor agregado","goal":"Transformar atraso e mudança em valor defensável.","intro":["Quantum é o valor do pleito. Separe três componentes: custo direto da mudança, custo de atraso (manter a obra ativa por mais tempo: administração local, canteiro, equipamentos) e perda de produtividade (mesmo trabalho exigindo mais horas por interferência).","BDI: ao precificar aditivos, use o BDI do contrato e confronte com a faixa do Acórdão 2622/2013 do TCU quando o objeto for obra pública. O acórdão fixou faixas de referência por tipo de obra. Um vídeo da busca cita o Acórdão 2340/2024 sobre BDI diferenciado de equipamentos: confira se ele alterou algo do 2622.","Perda de produtividade é a parte mais difícil de provar. O método do Measured Mile compara a produtividade num trecho afetado com a de um trecho comparável sem interferência. A RP 25R-03 da AACE trata da estimativa de perda de produtividade em claims; segundo um artigo da FTI, ela aponta o Measured Mile e a análise de valor agregado como métodos preferidos. A RP é de 2004 e há relato não confirmado de atualização: confira no site da AACE.","Valor agregado (EVM) compara previsto (PV), realizado em valor (EV) e custo real (AC). SPI é EV dividido por PV e mede prazo; CPI é EV dividido por AC e mede custo. É ferramenta de controle e dá sinal precoce de desvio; não prova nexo causal sozinho."],"steps":[{"k":"artigo","t":"Assessing Loss of Productivity in Construction: The Importance of Contemporaneous Documentation","why":"Artigo que discute os métodos da RP 25R-03 e a documentação necessária.","h":1,"u":"https://www.fticonsulting.com/insights/articles/assessing-loss-productivity-construction-contemporaneous-documentation","pick":"P","src":"FTI Consulting"},{"k":"pdf","t":"Productivity Claims (artigo para advogados de construção)","why":"Texto da AGC sobre claims de produtividade.","h":1,"u":"https://www.agc.org/sites/default/files/users/user22628/CLE%20Paper_%20Productivity%20Claims%20.pdf","pick":"P","src":"AGC"},{"k":"norma","t":"PMI, Standard for Earned Value Management (2020)","why":"Norma atual de EVM do PMI.","h":2,"u":"https://www.pmi.org/fr-fr/standards/earned-value-management","pick":"P","src":"PMI"},{"k":"pdf","t":"Acórdão 2622/2013-TCU-Plenário: parâmetros de BDI","why":"Leia a parte dispositiva e as tabelas de faixas.","h":1,"u":"https://www.mpf.mp.br/o-mpf/unidades/pr-to/transparencia/licitacoes-novo/2016/12Acordao26222013BDI.pdf","pick":"P","src":"cópia no MPF"},{"k":"texto","t":"Texto técnico da aula 8","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":3,"u":"#texto-8","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":1,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"Como usar a tabela SINAPI 2026 em orçamentos de obra (Eng. Alex Wetler)","why":"Visto na aula 1: SINAPI e orçamento.","h":0,"u":"https://www.youtube.com/watch?v=Ld-hcGEjMgI","pick":"R","src":"YouTube · 23,4 mil visualizações · jul/2025 · português · 20 min","f":"bdi-tcu"},{"k":"vídeo","t":"Valor Agregado (EVM) explicado em 11 minutos","why":"Visto na aula 1: valor agregado.","h":0,"u":"https://www.youtube.com/watch?v=vyT2YrgHHJo","pick":"R","src":"YouTube · 33,5 mil visualizações · nov/2025 · inglês · 11 min","f":"evm"}],"q":["Como separar custo direto, custo de atraso e perda de produtividade?","O que é o método do Measured Mile e quando ele não se aplica?","O que o PV, EV e AC dizem sobre desvio de prazo e custo?"],"sum":"Escreva: (1) os três componentes do quantum; (2) como o BDI e o Acórdão 2622/2013 entram no cálculo; (3) como funciona o Measured Mile e suas limitações; (4) o que EV, PV, AC, SPI e CPI medem.","h":9},{"n":9,"t":"Dispute Boards no Brasil","goal":"Regras da ICC e do CBMA, Lei 14.133 e a eficácia da decisão do comitê.","intro":["Dispute Board é um comitê, em geral de três profissionais, que acompanha o contrato e resolve divergências durante a obra. Nas regras da ICC de 2015 há três modelos: DRB (Dispute Review Board), que emite recomendações que só vinculam se ninguém objetar em 30 dias; DAB (Dispute Adjudication Board), que emite decisões de cumprimento imediato; e CDB (Combined Dispute Board), que combina os dois.","As regras da ICC organizam o trabalho do comitê em três serviços: prevenção de divergências (avoidance), assistência informal e referência formal para uma conclusão. A função preventiva é a que mais evita disputa. Um comitê que só se reúne na crise perde o principal valor.","No Brasil, a Lei 14.133 prevê meios alternativos de solução de controvérsias, incluindo comitê de resolução de disputas, nos arts. 151 a 154. O regulamento de arbitragem do CBMA de 2025 trata de arbitragem, mediação e dispute board. O CAM-CCBC também tem regulamento próprio de dispute board, que não localizei como página oficial: a aula indica trabalhos acadêmicos que o analisam. O Enunciado 6 da I Jornada de Prevenção e Solução Extrajudicial de Litígios do CJF trata o comitê de resolução de disputas como método consensual de solução de conflito. A eficácia executiva da decisão é matéria em consolidação; confirme jurisprudência com advogado.","Uma busca anterior mencionou uma lei estadual do Rio Grande do Sul sobre o tema. Não verifiquei; confirme se existe e o número antes de citar. Não encontrei vídeo específico sobre dispute boards com mais de 10 mil visualizações, até 2 anos e pelo menos 10 minutos. O vídeo de tema próximo é o da Lei 14.133 completa, que pode tratar dos meios alternativos de solução de controvérsias."],"steps":[{"k":"pdf","t":"ICC Dispute Board Rules 2015 (apêndices de 2018)","why":"Fonte oficial. Compare DRB, DAB e CDB.","h":2,"u":"https://iccwbo.org/wp-content/uploads/sites/3/2015/09/icc-dispute-board-rules-english-version.pdf","pick":"P","src":"ICC"},{"k":"norma","t":"Lei 14.133/2021, arts. 151 a 154","why":"Leia o texto e compare com as regras da ICC.","h":1,"u":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm","pick":"P","src":"Planalto"},{"k":"pdf","t":"Regulamento de Arbitragem do CBMA (2025), que inclui dispute board","why":"Cópia hospedada em veículo jurídico; confirme no site do CBMA.","h":1,"u":"https://images.jota.info/wp-content/uploads/2025/01/cbma-regulamento-de-arbitragem-cbma-02-01-2025.pdf","pick":"P","src":"JOTA"},{"k":"pdf","t":"Manual de Dispute Boards (Figueiredo): arquivo da biblioteca do STJ","why":"Título deduzido do nome do arquivo. Em português.","h":1,"u":"https://bdjur.stj.jus.br/jspui/bitstream/2011/159006/manual_dispute_boards_figueiredo.pdf","pick":"P","src":"Biblioteca do STJ"},{"k":"pdf","t":"Dispute Boards no Brasil (Silva): arquivo da biblioteca do STJ","why":"Título deduzido do nome do arquivo. Em português.","h":1,"u":"https://bdjur.stj.jus.br/jspui/bitstream/2011/158799/dispute_boards_brasil_silva.pdf","pick":"P","src":"Biblioteca do STJ"},{"k":"texto","t":"Texto técnico da aula 9","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":2,"u":"#texto-9","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":1,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"Licitações e contratos administrativos: domínio completo da Lei 14.133 (Gran Jurídico)","why":"Lei 14.133 completa; tema próximo (meios alternativos de solução de controvérsias).","h":0,"u":"https://www.youtube.com/watch?v=s4B0WBb-1kM","pick":"A","src":"YouTube · 38,3 mil visualizações · abr/2026 · português · 57 min","f":"db-brasil"},{"k":"pdf","t":"Enunciados aprovados na I Jornada de Prevenção e Solução Extrajudicial de Litígios","why":"Inclui o enunciado sobre comitês de resolução de disputas.","h":0,"u":"https://cjf.jus.br/cjf/corregedoria-da-justica-federal/centro-de-estudos-judiciarios-1/prevencao-e-solucao-extrajudicial-de-litigios/enunciados-aprovados/view/++widget++form.widgets.arquivo/@@download/Enunciados+Aprovados+I+JPS-revisado.pdf","pick":"A","src":"CJF"},{"k":"pdf","t":"O que é Dispute Board (palestra do TCM-SP)","why":"Material de palestra em português.","h":0,"u":"https://egcportalantigo.tcm.sp.gov.br/images/conteudo-palestras/dispute-boards/o-que-e-dispute-board.pdf","pick":"A","src":"TCM-SP"},{"k":"pdf","t":"Dissertação IDP: inclui análise do regulamento de dispute board do CAM-CCBC","why":"Trabalho acadêmico, 2022.","h":0,"u":"https://repositorio.idp.edu.br/bitstream/123456789/4360/1/DISSERTACAO_RICARDO%20CARVALHO%20LUBARINO%20DOS%20SANTOS_MESTRADO%20ADM_2022.docx.pdf","pick":"A","src":"IDP"},{"k":"livro","t":"Chern on Dispute Boards: Practice and Procedure","why":"Referência internacional. Página da editora; livro pago.","h":0,"u":"https://www.routledge.com/Chern-on-Dispute-Boards-Practice-and-Procedure/Chern/p/book/9781032177236","pick":"A","src":"Routledge"},{"k":"norma","t":"DRBF: manual do Dispute Board (acesso de membro)","why":"Manual da Dispute Resolution Board Foundation.","h":0,"u":"https://drbf.memberclicks.net/dispute-board-manual","pick":"A","src":"DRBF"},{"k":"curso","t":"Complemento FGV: Gestão de Disputas em Projetos de Infraestrutura (16 horas-aula)","why":"Curso curto de claims e disputas. Opcional, pago; confirme a próxima turma.","h":0,"u":"https://educacao-executiva.fgv.br/produto/gestao-de-disputas-em-projetos-de-infraestrutura-aspectos-teoricos-e-praticos-01tV200000Ij5RNIAZ","pick":"A","src":"FGV"}],"q":["Qual a diferença entre DRB, DAB e CDB nas regras da ICC?","O que a Lei 14.133 prevê sobre comitê de resolução de disputas?","Quando um comitê é melhor que a arbitragem direta numa obra de longo prazo?"],"sum":"Escreva: (1) o que é um Dispute Board e os três modelos da ICC; (2) a função preventiva do comitê; (3) o que a lei brasileira prevê e o que ainda é incerto; (4) como você usaria um comitê no seu contrato.","h":9},{"n":10,"t":"Do pleito ao laudo: fechamento do curso","goal":"Ver como profissionais montam, provam e apresentam um pleito de prazo e custo, e consolidar tudo no seu resumo final.","intro":["Esta aula junta as anteriores. O caminho de um pleito de prazo e custo é: contrato e matriz de risco (aula 2 e 3), notificação e prova (4), cronograma auditado (5), método de atraso justificado (6 e 7), quantum (8) e, se a negociação falha, comitê de disputas (9).","Esta aula se apoia na ficha do ciclo de claim, na apostila e nas leituras sobre TIA. Não encontrei vídeo sobre laudo técnico de pleito com mais de 10 mil visualizações, até 2 anos e pelo menos 10 minutos.","Seu resumo final desta aula deve funcionar como o roteiro que você usaria diante de um pleito novo. Releia os resumos das aulas anteriores antes de escrevê-lo."],"steps":[{"k":"artigo","t":"Time Impact Analysis for Construction Delay Claims","why":"Explicação do método e seu uso em claims.","h":1,"u":"https://rimkus.com/?p=16412","pick":"P","src":"Rimkus"},{"k":"artigo","t":"Time Impact Analysis in Construction","why":"Introdução ao TIA.","h":1,"u":"https://smartpm.com/blog/time-impact-analysis-in-construction","pick":"P","src":"SmartPM"},{"k":"texto","t":"Texto técnico da aula 10","why":"Explica a aula e todas as técnicas. Abre aqui mesmo, só texto.","h":4,"u":"#texto-10","pick":"P","src":"Texto do curso"},{"k":"texto","t":"Ler os textos das técnicas desta aula","why":"Um texto por técnica, listados no fim desta página.","h":3,"u":null,"pick":"P","src":"Textos do curso"},{"k":"vídeo","t":"Introdução à gestão da construção: curso completo (Tim Fairley)","why":"Curso de gestão da construção; tema próximo do ciclo de claim.","h":0,"u":"https://www.youtube.com/watch?v=Tn3c2-prL7I","pick":"A","src":"YouTube · 14,9 mil visualizações · mar/2025 · inglês · 1h28","f":"ciclo-claim"}],"q":["Se um pleito novo chegasse hoje, qual seria a sua primeira ação, e por quê?","Qual parte da cadeia (contrato, notificação, cronograma, atraso, quantum, comitê) é a sua mais fraca?"],"sum":"Resumo final do curso. Escreva o roteiro que você seguiria diante de um pleito novo, da leitura do contrato à apresentação ao comitê, citando as ferramentas de cada aula e o que você faria diferente do que fazia antes.","h":9}];

function queue(){
  const q=[];
  LESSONS.forEach(L=>{
    L.steps.filter(x=>x.h>0).forEach(x=>q.push({id:x.id,t:x.t,k:x.k,h:x.h,u:x.u,n:L.n,done:!!st.done[x.id]}));

}
function planOf(m){const pl=Object.assign({},DEFPLAN,st.plan||{});if(m)pl.months=m;if(!pl.start)pl.start=isoD(new Date());return pl}
function buildAgenda(pl){
  const today=startOf(isoD(new Date()));
  const start=startOf(pl.start),end=addDays(addMonths(start,pl.months),-1);
  const from=today>start?today:start;
  const days=[];
  for(let d=new Date(from);d<=end;d=addDays(d,1)){
    if(pl.days.includes(d.getDay())){const g=d.getDay();days.push({date:new Date(d),w:g===6?2:g===0?1.5:1})}
  }
  const rem=queue().filter(x=>!x.done);
  const Hrem=rem.reduce((a,x)=>a+x.h,0);
  const W=days.reduce((a,d)=>a+d.w,0);
  const h0=W?Hrem/W:0;
  let i=0,left=rem.length?rem[0].h:0;
  const out=[];let cumW=0,alloc=0;
  days.forEach((d,idx)=>{
    const last=idx===days.length-1;
    cumW+=d.w;
    const target=last?Hrem:Math.round(Hrem*cumW/W*4)/4;
    let budget=last?1e9:Math.max(0,target-alloc);
    const entries=[];let used=0;
    while(i<rem.length&&budget>1e-6){
      const t=rem[i];const cont0=left<t.h-1e-9;const take=Math.min(budget,left);
      entries.push({t,part:take,fromPrev:cont0,toNext:take<left-1e-9});
      budget-=take;used+=take;left-=take;
      if(left<=1e-9){i++;left=i<rem.length?rem[i].h:0}
    }
    alloc+=used;
    out.push({date:d.date,w:d.w,hours:used,entries});
  });
  return {days:out,Hrem,h0,W,start,end,empty:!days.length};
}
function blocksFor(day,pl){
  const g=day.date.getDay();const s0=toMin(g===6?pl.tsat:g===0?pl.tsun:pl.tw);
  const MAX=150;let mins=Math.round(day.hours*60);const bl=[];
  if(g===6||g===0){
    const a=Math.min(mins,MAX);bl.push([s0,s0+a]);mins-=a;
    if(mins>0){const b=Math.min(mins,MAX);const s2=Math.max(toMin("14:00"),s0+a+30);bl.push([s2,s2+b]);mins-=b}
    if(mins>0){const s3=bl[1][1]+30;bl.push([s3,s3+mins])}
  }else bl.push([s0,s0+mins]);
  return bl;
}
function level(h){return h<=1.25?["tranquilo","ok"]:h<=2.25?["firme",""]:["puxado","warn"]}
function streak(){
  const lg=x=>st.log&&st.log[isoD(x)]>0;
  const pl=planOf();const sd=x=>pl.days.includes(x.getDay());
  let n=0,d=startOf(isoD(new Date()));
  if(!lg(d))d=addDays(d,-1);
  for(let i=0;i<400;i++){if(lg(d))n++;else if(sd(d))break;d=addDays(d,-1)}
  return n;
}
